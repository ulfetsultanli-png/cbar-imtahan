asimmetriyası kimi sürtünmələr var","Real bazarda hedcinq qadağandır","Hedcinq yalnız vergi ödəmək üçündür"],"a":1,"e":"Risk idarəetməsinin dəyəri sürtünmələrdən qaynaqlanır: maliyyə çətinliyi xərclərinin azalması, borclanma imkanının artması, investisiya planlarının qorunması."},{"q":"FSB terminologiyasına görə “risk profili” nədir?","o":["Götürülə biləcək maksimum risk","Müəyyən anda bankın faktiki risk vəziyyəti","Strateji məqsədlər naminə qəbul edilən risk səviyyəsi","Desk səviyyəsində limit"],"a":1,"e":"Risk profili risk iştahası və limitlərlə müqayisə edilərək izlənir; maksimum risk tutumdur, qəbul edilən səviyyə isə iştahadır."},{"q":"Risk iştahası bəyanatına hansı ifadə keyfiyyət göstəricisi kimi daxil ola bilər?","o":["“LCR ən azı 130% olmalıdır”","“CET1 əmsalı 12%-dən aşağı olmamalıdır”","“Müştəriləri başa düşmədikləri məhsullara cəlb etmirik”","“VaR limiti 5 mln manatdır”"],"a":2,"e":"Risk iştahası yalnız rəqəmlərdən ibarət deyil: reputasiya, davranış və tənzimləyici uyğunluq kimi sahələrdə keyfiyyət ifadələri də istifadə olunur."},{"q":"Treynor əmsalını Sharpe əmsalından fərqləndirən nədir?","o":["Treynor gəliri nəzərə almır","Treynor yalnız sistematik riski (beta), Sharpe isə ümumi riski (standart kənarlaşma) nəzərə alır","Sharpe yalnız istiqrazlar üçündür","Aralarında fərq yoxdur"],"a":1,"e":"Yaxşı diversifikasiya olunmuş portfellərin müqayisəsində Treynor, tək portfelin qiymətləndirilməsində Sharpe daha uyğundur."},{"q":"Portfelin gəlirliliyi 11%, betası 1,2, risksiz faiz 3%, bazarın gəlirliliyi 9%-dir. Jensen alfası neçədir?","o":["+2,0%","+0,8%","−0,8%","+8,0%"],"a":1,"e":"CAPM üzrə tələb olunan gəlir 3% + 1,2 × (9% − 3%) = 10,2%; alfa = 11% − 10,2% = +0,8%: portfel riskinə görə gözləniləndən yaxşı nəticə göstərib."},{"q":"Risksiz faiz 4%, bazarın gözlənilən gəlirliliyi 10%, səhmin betası 0,9-dur. CAPM-ə görə tələb olunan gəlirlilik neçədir?","o":["9,4%","10,0%","13,0%","5,4%"],"a":0,"e":"E(R) = 4% + 0,9 × (10% − 4%) = 9,4%. Beta 1-dən kiçik olduğu üçün tələb olunan gəlirlilik bazarınkından aşağıdır."},{"q":"P(A) = 0,2 və P(B) = 0,3 olan A və B hadisələri uyğunsuzdur (eyni vaxtda baş verə bilmir). Hansı fikir doğrudur?","o":["P(A ∪ B) = 0,44","Hadisələr müstəqildir","P(A ∩ B) = 0,06","Hadisələr müstəqil deyil, çünki P(A ∩ B) = 0, halbuki P(A) × P(B) = 0,06"],"a":3,"e":"Uyğunsuz hadisələrdə biri baş verdikdə digərinin ehtimalı sıfıra enir — bu, güclü asılılıqdır. Onların birləşməsinin ehtimalı 0,2 + 0,3 = 0,5-dir."},{"q":"Borcalanların 60%-i A, 40%-i B seqmentindədir; defolt ehtimalı A-da 2%, B-də 5%-dir. Təsadüfi seçilmiş borcalanın defolt ehtimalı neçədir?","o":["7,0%","3,5%","3,2%","2,0%"],"a":2,"e":"Tam ehtimal düsturu: 0,6 × 2% + 0,4 × 5% = 1,2% + 2,0% = 3,2%."},{"q":"Normal paylanmanın ekses (kurtosis) göstəricisi neçədir və maliyyə gəlirlərində bu göstərici adətən necə olur?","o":["3; maliyyə gəlirlərində adətən 3-dən böyükdür (qalın quyruqlar)","0; maliyyə gəlirlərində mənfi olur","1; maliyyə gəlirlərində 1-ə bərabərdir","3; maliyyə gəlirlərində həmişə 3-dən kiçikdir"],"a":0,"e":"Kurtosis 3-dən böyük olduqda (leptokurtik paylanma) ekstremal itkilər normal paylanmanın proqnozundan tez-tez baş verir; buna görə normal fərziyyəli modellər quyruq riskini aşağı qiymətləndirir."},{"q":"Gəlirlərin paylanmasında mənfi asimmetriya (skewness) nə deməkdir?","o":["Sağ quyruq uzundur — böyük qazanclar daha ehtimallıdır","Sol quyruq uzundur — böyük itkilər böyük qazanclardan daha ehtimallıdır","Paylanma tam simmetrikdir","Dispersiya sıfırdır"],"a":1,"e":"Bir çox maliyyə alətinin gəliri mənfi asimmetriyalıdır: tez-tez kiçik qazanclar və nadir böyük itkilər."},{"q":"Mərkəzi limit teoremi nəyi ifadə edir?","o":["Ortanın paylanması həmişə bərabərdir","Bütün maliyyə gəlirləri normal paylanmaya tabedir","Seçmə böyüdükcə dispersiya artır","Müstəqil, eyni paylanmış dəyişənlərin ortası, ilkin paylanmadan asılı olmayaraq, seçmə böyüdükcə normal paylanmaya yaxınlaşır"],"a":3,"e":"Bu teorem ortalar üzrə etibarlılıq intervallarının və hipotez testlərinin əsasını təşkil edir."},{"q":"Seçmə dispersiyasının qərəzsiz qiymətləndiricisini almaq üçün kvadrat kənarlaşmaların cəmi nəyə bölünür?","o":["n − 1-ə","n-ə","n + 1-ə","√n-ə"],"a":0,"e":"Seçmə ortası həqiqi orta əvəzinə istifadə edildiyi üçün bir sərbəstlik dərəcəsi itir; n − 1-ə bölmək qərəzi aradan qaldırır."},{"q":"99% etibarlılıqla ikitərəfli test üçün normal paylanmanın kritik qiyməti təxminən neçədir?","o":["1,960","2,326","2,576","1,645"],"a":2,"e":"İkitərəfli testdə 1%-lik əhəmiyyətlilik hər quyruğa 0,5% bölünür: z = 2,576. 2,326 isə 99% birtərəfli qiymətdir."},{"q":"Strategiyanın 64 aylıq gəlirliliyinin ortası 1,2%, standart kənarlaşması 4%-dir. H₀: orta = 0 üçün t-statistika neçədir və 5% səviyyəsində (ikitərəfli) nəticə nədir?","o":["0,3; H₀ rədd edilmir","2,4; H₀ rədd edilir","2,4; H₀ rədd edilmir","19,2; H₀ rədd edilir"],"a":1,"e":"t = 1,2 / (4 / √64) = 1,2 / 0,5 = 2,4 > 1,96. Gəlirlilik statistik baxımdan sıfırdan fərqlidir."},{"q":"Reqressiyada Y-ə təsir edən və X ilə korrelyasiyası olan vacib dəyişən modelə daxil edilmədikdə hansı problem yaranır?","o":["Stasionarlıq","Heteroskedastiklik","Buraxılmış dəyişən qərəzi — β qiymətləndiricisi qərəzli olur","Problem yaranmır"],"a":2,"e":"Bu halda X-in təsiri buraxılmış dəyişənin təsiri ilə qarışır; X ilə səhv arasında korrelyasiya yaranır və OLS-in əsas fərziyyəsi pozulur."},{"q":"Hər ikisi trendli iki qeyri-stasionar sıra arasında reqressiya çox yüksək R² göstərir, lakin real iqtisadi əlaqə yoxdur. Bu necə adlanır?","o":["Effektiv qiymətləndirmə","Multikollinearlıq","Homoskedastiklik","Saxta (spurious) reqressiya"],"a":3,"e":"Qeyri-stasionar sıralarda ümumi trend yalançı əlaqə yaradır; vahid kök testi (Dickey–Fuller) aparılmalı və adətən fərqlər (gəlirlər) modelləşdirilməlidir."},{"q":"AR(1) prosesində c = 1 və φ = 0,75-dir. Prosesin uzunmüddətli ortası neçədir?","o":["0,75","1,33","4","1"],"a":2,"e":"E(y) = c / (1 − φ) = 1 / 0,25 = 4. |φ| \u003c 1 olduğu üçün proses stasionardır və bu ortaya qayıdır."},{"q":"Spot faizlər 1 il üçün 5%, 2 il üçün 6%-dir (illik). 1-ci ildən 2-ci ilə forvard faiz təxminən neçədir?","o":["5,50%","6,00%","7,01%","11,00%"],"a":2,"e":"(1,06)² = (1,05) × (1 + f) → f = 1,1236 / 1,05 − 1 ≈ 7,01%. Artan spot əyri forvard faizlərin spot faizlərdən yüksək olduğunu göstərir."},{"q":"Nominalı 100, illik kuponu 5%, müddəti 2 il olan istiqrazın 6% gəlirlilikdə qiyməti təxminən nə qədərdir?","o":["101,86","100,00","98,17","94,34"],"a":2,"e":"P = 5 / 1,06 + 105 / 1,06² ≈ 4,72 + 93,45 = 98,17. Kupon gəlirlilikdən aşağı olduğu üçün istiqraz diskontla satılır."},{"q":"Sıfır kuponlu istiqrazın Makoley dyurasiyası nəyə bərabərdir?","o":["Müddətin yarısına","Sıfıra","Onun ödəniş müddətinə","Gəlirliliyə"],"a":2,"e":"Yeganə pul axını müddətin sonunda olduğu üçün çəkili orta müddət ödəniş müddətinə bərabərdir; eyni müddətli kuponlu istiqrazın dyurasiyası daha qısadır."},{"q":"İstiqrazın müsbət konveksiyası investor üçün nə deməkdir?","o":["İtki həmişə qazancdan böyükdür","Qiymət faizdən asılı deyil","Faiz artanda qiymət artır","Faiz düşəndə qiymət dyurasiyanın proqnozundan çox artır, faiz artanda isə ondan az düşür"],"a":3,"e":"Konveksiya qiymət-gəlirlilik əyrisinin əyriliyidir; böyük faiz dəyişikliklərində yalnız dyurasiyaya əsaslanan təxmin xətalı olur."},{"q":"Geri çağırıla bilən (callable) istiqraz investor üçün hansı əlavə riski daşıyır?","o":["Kupon avtomatik artır","İnvestor istiqrazı istədiyi vaxt təqdim edə bilir","Faizlər düşdükdə emitent istiqrazı erkən geri çağırır və investor yüksək kupondan məhrum olur","Heç bir əlavə risk yoxdur"],"a":2,"e":"Bu risk erkən geri çağırma (və reinvestisiya) riskidir; kompensasiya olaraq belə istiqrazlar adətən daha yüksək gəlirlilik təklif edir."},{"q":"Baza aktivin volatilliyi artarsa, call və put opsionların qiymətləri necə dəyişər?","o":["Hər ikisi azalar","Call artar, put azalar","Call azalar, put artar","Hər ikisi artar"],"a":3,"e":"Opsion alıcısının itkisi mükafatla məhduddur, potensial qazancı isə volatillik artdıqca böyüyür; buna görə volatillik hər iki opsionun dəyərini artırır."},{"q":"İnvestor səhmlərinə sahibdir və eniş riskindən qorunmaq istəyir. Hansı strategiya uyğundur?","o":["Daha çox səhm almaq","Örtülməmiş call satmaq","Qoruyucu put — put opsion almaq","Straddle satmaq"],"a":2,"e":"Put opsion qiymət icra qiymətindən aşağı düşdükdə itkini kompensasiya edir; ödənilən mükafat “sığorta haqqıdır”."},{"q":"Bankın I dərəcəli kapitalı 120 mln, II dərəcəli kapitalı 30 mln, risk çəkili aktivləri 1 000 mln manatdır. Məcmu kapitalın adekvatlıq əmsalı neçədir?","o":["3%","12%","15%","150%"],"a":2,"e":"(120 + 30) / 1 000 = 15%; I dərəcəli kapitalın adekvatlığı 12%-dir. Sistem əhəmiyyətli bank üçün Mərkəzi Bankın minimumları (12% və 6%) ödənilir, lakin məcmu kapital üzrə ehtiyat cəmi 3 faiz bəndidir."}]},{"id":"IE","code":"İƏ","title":"İqtisadiyyatın əsasları","req":true,"v":[[0,6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108],[1,7,13,19,25,31,37,43,49,55,61,67,73,79,85,91,97,103,109],[2,8,14,20,26,32,38,44,50,56,62,68,74,80,86,92,98,104,110],[3,9,15,21,27,33,39,45,51,57,63,69,75,81,87,93,99,105],[4,10,16,22,28,34,40,46,52,58,64,70,76,82,88,94,100,106],[5,11,17,23,29,35,41,47,53,59,65,71,77,83,89,95,101,107]],"qs":[{"q":"İqtisadiyyat elminin əsas tədqiqat problemi ən düzgün hansı variantda ifadə olunur?","o":["Məhdud ehtiyacların sonsuz resurslarla təmin edilməsi","Sonsuz ehtiyacların məhdud resurslarla təmin edilməsi","Bütün resursların dövlət tərəfindən bölüşdürülməsi","Firmaların yalnız mənfəətini maksimumlaşdırması"],"a":1,"e":"İqtisadiyyat sonsuz ehtiyacların məhdud resurslarla təmin edilməsini öyrənir; qıtlıq seçim zərurəti yaradır.","tag":"İqtisadiyyata giriş və mikroiqtisadi anlayışlar"},{"q":"Bir şəxs şənbə günü iqtisadiyyat təlimində iştirak etməyi seçir. Həmin vaxt 120 AZN qazana biləcəyi əlavə işdə çalışa bilərdi. Təlimə görə 30 AZN nəqliyyat xərci də çəkir. Materialdakı alternativ xərc anlayışına əsasən təlimdə iştirakın alternativ xərci nə qədərdir?","o":["30 AZN","90 AZN","120 AZN","150 AZN"],"a":2,"e":"Alternativ xərc imtina edilən ən yaxşı alternativin dəyəridir — itirilən 120 AZN qazanc. 30 AZN nəqliyyat birbaşa (aşkar) xərcdir; ikisinin cəmi (150 AZN) qərarın ümumi iqtisadi xərcini göstərir.","tag":"İqtisadiyyata giriş və mikroiqtisadi anlayışlar"},{"q":"Borcalan öz maliyyə vəziyyəti və riskləri haqqında banka nisbətən daha çox məlumata malikdir. Bu hal hansı anlayışla ifadə olunur?","o":["Bazar gücü","İnformasiya asimmetriyası","Mənfi kənar təsir","Rəqabətsiz istehlak"],"a":1,"e":"Tərəflərdən biri digərindən daha çox məlumata malikdir → informasiya asimmetriyası.","tag":"İqtisadiyyata giriş və mikroiqtisadi anlayışlar"},{"q":"Pepsi və Coca-Cola əvəzləyici məhsullardır. Digər amillər sabit qalmaqla Pepsi-nin qiyməti yüksəlirsə, Coca-Cola bazarında ən çox ehtimal olunan dəyişiklik hansıdır?","o":["Coca-Cola-ya tələb azalır","Coca-Cola-ya tələb artır","Coca-Cola-nın təklifi azalır","Coca-Cola-nın təklif əyrisi boyunca hərəkət baş verir"],"a":1,"e":"Əvəzləyicinin bahalaşması istehlakçıları Coca-Cola-ya yönəldir → Coca-Cola-ya tələb əyrisi sağa sürüşür.","tag":"İqtisadiyyata giriş və mikroiqtisadi anlayışlar"},{"q":"Digər amillər dəyişməz qalmaqla istehsalda istifadə olunan əsas xammalın qiyməti yüksəlir. Məhsul bazarında ən çox ehtimal olunan nəticə hansıdır?","o":["Təklif əyrisi sağa sürüşür","Təklif əyrisi sola sürüşür","Tələb əyrisi sağa sürüşür","Təklif əyrisi boyunca aşağı hərəkət baş verir"],"a":1,"e":"Xammal bahalaşır → istehsal xərci artır → təklif azalır (S sola sürüşür).","tag":"İqtisadiyyata giriş və mikroiqtisadi anlayışlar"},{"q":"Tələb əyrisi sağa, təklif əyrisi isə sola sürüşür. Hansı nəticə mütləq baş verir?","o":["Tarazlıq qiyməti artır","Tarazlıq qiyməti azalır","Tarazlıq miqdarı artır","Tarazlıq miqdarı dəyişmir"],"a":0,"e":"D sağa və S sola → qiymət mütləq artır; miqdarın istiqaməti dəyişikliklərin nisbi gücündən asılıdır.","tag":"İqtisadiyyata giriş və mikroiqtisadi anlayışlar"},{"q":"Müəssisənin istehsal fəaliyyəti nəticəsində havanın çirklənməsi ətrafda yaşayanlar üçün əlavə xərc yaradır. Bu vəziyyət hansına ən yaxşı nümunədir?","o":["Müsbət kənar təsir","Mənfi kənar təsir","İctimai nemət","İnformasiya asimmetriyası"],"a":1,"e":"Üçüncü şəxslərə əlavə xərc yaranır → mənfi kənar təsir.","tag":"İqtisadiyyata giriş və mikroiqtisadi anlayışlar"},{"q":"Dövrü axın modelində ev təsərrüfatlarının firmalara təqdim etdiyi resurs və onun müqabilində aldığı gəlir hansı variantda düzgün uyğunlaşdırılıb?","o":["Əmək — transfert","Torpaq — renta","Kapital — vergi","Sahibkarlıq qabiliyyəti — faiz"],"a":1,"e":"Torpaq → renta (əmək → əməkhaqqı, kapital → faiz, sahibkarlıq → mənfəət).","tag":"İqtisadiyyata giriş və mikroiqtisadi anlayışlar"},{"q":"Bazarda tələb və təklif funksiyaları: Qd = 100 − 2P, Qs = 20 + 2P. Tarazlıq qiyməti və tarazlıq miqdarı müvafiq olaraq hansıdır?","o":["P = 10; Q = 80","P = 20; Q = 60","P = 30; Q = 40","P = 40; Q = 20"],"a":1,"e":"100 − 2P = 20 + 2P → 4P = 80 → P = 20; Q = 100 − 2·20 = 60.","tag":"İqtisadiyyata giriş və mikroiqtisadi anlayışlar"},{"q":"Məhsulun qiyməti 10% artır və tələb olunan miqdar 2% azalır. Qiymət elastikliyinin mütləq qiyməti və tələbin xarakteri hansıdır?","o":["0,2; qeyri-elastik","0,5; qeyri-elastik","2,0; elastik","5,0; elastik"],"a":0,"e":"|e| = 2% / 10% = 0,2 \u003c 1 → tələb qeyri-elastikdir.","tag":"İqtisadiyyata giriş və mikroiqtisadi anlayışlar"},{"q":"Firma 400 vahid istehsal etdikdə TC = 12 000 AZN, TVC = 8 000 AZN-dir. İstehsal 500 vahidə yüksəldikdə TVC = 9 500 AZN olur. 400–500 intervalında marjinal xərc (MC) ən yaxın olaraq nə qədərdir?","o":["10 AZN","15 AZN","19 AZN","30 AZN"],"a":1,"e":"TFC = 12 000 − 8 000 = 4 000 (dəyişmir). MC = ΔTVC / ΔQ = (9 500 − 8 000) / 100 = 15 AZN.","tag":"İstehsal xərcləri, gəlirlər və mənfəət"},{"q":"Müəyyən istehsal həcmində ATC = 24 AZN, AVC = 18 AZN, MC = 20 AZN-dir. İstehsal həcmi cüzi artırıldıqda hansı fikir ən doğrudur?","o":["Həm ATC, həm AVC azalacaq","Həm ATC, həm AVC artacaq","ATC azalacaq, AVC artacaq","ATC artacaq, AVC azalacaq"],"a":2,"e":"MC (20) \u003c ATC (24) → ATC azalır; MC (20) > AVC (18) → AVC artır.","tag":"İstehsal xərcləri, gəlirlər və mənfəət"},{"q":"Sahibkar öz biznesində işləmək üçün illik 30 000 AZN maaş aldığı əvvəlki işindən imtina edir. Biznesin illik məcmu gəliri 150 000 AZN, aşkar xərcləri 110 000 AZN-dir. Firmanın iqtisadi mənfəəti nə qədərdir?","o":["10 000 AZN","30 000 AZN","40 000 AZN","70 000 AZN"],"a":0,"e":"İqtisadi mənfəət = 150 000 − 110 000 − 30 000 (gizli xərc) = 10 000 AZN. Mühasibat mənfəəti 40 000 olardı.","tag":"İstehsal xərcləri, gəlirlər və mənfəət"},{"q":"Firma növbəti vahid məhsul üzrə 12 AZN marjinal gəlir və 9 AZN marjinal xərc əldə edir. Mənfəətin maksimumlaşdırılması baxımından firma ən çox ehtimalla:","o":["istehsalı artırmalıdır","istehsalı azaltmalıdır","mövcud istehsal səviyyəsini saxlamalıdır","istehsalı dayandırmalıdır"],"a":0,"e":"MR (12) > MC (9) → əlavə vahid mənfəəti artırır → istehsalı artırmaq lazımdır.","tag":"İstehsal xərcləri, gəlirlər və mənfəət"},{"q":"Cədvəl firmanın istehsal göstəricilərini əks etdirir. Firmanın mənfəətini maksimumlaşdıran istehsal həcmi hansıdır?","o":["2 vahid","3 vahid","4 vahid","5 vahid"],"a":2,"e":"Q = 4-də MR = MC = 6 (MP = 0). 1–3-cü vahidlər mənfəəti artırır (+7, +4, +1), 5-ci vahid azaldır (4 \u003c 7). Kursun qaydasına görə optimal həcm MR = MC nöqtəsidir → 4 vahid. (4-cü vahid mənfəəti dəyişmədiyi üçün Q = 3 və Q = 4-də ümumi mənfəət eynidir; test MR = MC qaydasını yoxlayır.)","t":{"head":["Q","1","2","3","4","5"],"rows":[["MR","12","10","8","6","4"],["MC","5","6","7","6","7"]]},"tag":"İstehsal xərcləri, gəlirlər və mənfəət"},{"q":"Firma uzun müddətdə istehsal həcmini artırarkən LRMC \u003c LRAC vəziyyəti müşahidə olunur. Bu vəziyyətdə LRAC ən çox ehtimalla:","o":["azalır","artır","sabit qalır","sıfıra yaxınlaşır"],"a":0,"e":"LRMC \u003c LRAC olduqda LRAC azalır.","tag":"İstehsal xərcləri, gəlirlər və mənfəət"},{"q":"Firma bütün istehsal amillərini 20% artırır, nəticədə məhsul buraxılışı 30% artır. Bu vəziyyət necə xarakterizə olunur?","o":["Constant returns to scale","Decreasing returns to scale","Increasing returns to scale","Diseconomies of scale"],"a":2,"e":"Output inputlardan sürətli artır (30% > 20%) → artan miqyas effekti.","tag":"İstehsal xərcləri, gəlirlər və mənfəət"},{"q":"Analitik iki müşahidəni qeyd edir. Müşahidələr müvafiq olaraq hansı anlayışları ifadə edir?\nMüşahidə 1: firmanın bütün inputları 10% artır, output isə 6% artır.\nMüşahidə 2: istehsal həcmi artdıqca firmanın LRAC göstəricisi yüksəlir.","o":["Increasing returns to scale; economies of scale","Decreasing returns to scale; diseconomies of scale","Economies of scale; decreasing returns to scale","Constant returns to scale; diseconomies of scale"],"a":1,"e":"Output inputlardan az artır → azalan miqyas effekti; həcm artdıqca LRAC artır → mənfi miqyas iqtisadiyyatı.","tag":"İstehsal xərcləri, gəlirlər və mənfəət"},{"q":"Firma böyüdükcə işçilər daha dar ixtisaslaşmış funksiyaları yerinə yetirir, daha səmərəli texnologiya tətbiq edilir və böyük həcmli satınalmalarda endirimlər əldə olunur. Bu dəyişikliklərin ən ehtimal olunan nəticəsi:","o":["LRAC-ın artmasıdır","LRAC-ın azalmasıdır","decreasing returns to scale yaranmasıdır","MC-nin mütləq artmasıdır"],"a":1,"e":"İxtisaslaşma, səmərəli texnologiya və toplu alış endirimləri müsbət miqyas iqtisadiyyatı yaradır → LRAC azalır.","tag":"İstehsal xərcləri, gəlirlər və mənfəət"},{"q":"Minimum Efficient Scale (MES) anlayışı hansını ən doğru ifadə edir?","o":["Firmanın qısa müddətdə AVC-ni minimumlaşdırdığı istehsal həcmi","Firmanın marjinal gəlirinin sıfıra bərabər olduğu istehsal həcmi","Firmanın uzunmüddətli orta xərcinin minimum olduğu istehsal həcmi","Firmanın maksimum istehsal gücündə fəaliyyət göstərdiyi istənilən istehsal həcmi"],"a":2,"e":"MES — LRAC əyrisinin minimum olduğu istehsal həcmi.","tag":"İstehsal xərcləri, gəlirlər və mənfəət"},{"q":"A və B istehsalçılarının bir saat ərzində istehsal imkanları cədvəldəki kimidir. Y məhsulunun istehsalında nisbi üstünlük kimə məxsusdur?","o":["A-ya, çünki Y məhsulundan daha çox istehsal edir","A-ya, çünki hər iki məhsulda mütləq üstünlüyə malikdir","B-yə, çünki Y məhsulunun alternativ xərci daha aşağıdır","Heç birinə, çünki A hər iki məhsulda daha məhsuldardır"],"a":2,"e":"Y-in alternativ xərci: A üçün 8/4 = 2 X, B üçün 5/3 ≈ 1,67 X. B-nin alternativ xərci aşağıdır → nisbi üstünlük B-dədir. A-nın hər iki məhsulda mütləq üstünlüyü nisbi üstünlüyü müəyyən etmir.","t":{"head":["İstehsalçı","X məhsulu","Y məhsulu"],"rows":[["A","8","4"],["B","5","3"]]},"tag":"Bazar, rəqabət və təkmil rəqabət"},{"q":"İstehlakçı məhsul üçün maksimum 900 AZN ödəməyə hazırdır, bazar qiyməti isə 650 AZN-dir. İstehlakçı artıqlığı nə qədərdir?","o":["250 AZN","650 AZN","900 AZN","1 550 AZN"],"a":0,"e":"CS = 900 − 650 = 250 AZN.","tag":"Bazar, rəqabət və təkmil rəqabət"},{"q":"Bazarda istehlakçı artıqlığı 4 000 AZN, istehsalçı artıqlığı 2 500 AZN təşkil edir. Bazarın yaratdığı ümumi iqtisadi səmərə nə qədərdir?","o":["1 500 AZN","2 500 AZN","4 000 AZN","6 500 AZN"],"a":3,"e":"İqtisadi səmərə = CS + PS = 4 000 + 2 500 = 6 500 AZN.","tag":"Bazar, rəqabət və təkmil rəqabət"},{"q":"Aşağıdakılardan hansı bazar strukturunu müəyyən edən amillərdən biri deyil?","o":["Firmaların sayı və nisbi ölçüsü","Məhsulun fərqləndirilmə dərəcəsi","Firmanın qiymətqoyma gücü","Firmaların mühasibat uçotu metodunun seçimi"],"a":3,"e":"Mühasibat uçotu metodu bazar strukturunun 5 amilinə daxil deyil.","tag":"Bazar, rəqabət və təkmil rəqabət"},{"q":"Aşağıdakılardan hansı təkmil rəqabət bazarına ən uyğun xüsusiyyətdir?","o":["Firmalar qiyməti müstəqil müəyyən edirlər","Məhsullar yüksək dərəcədə fərqləndirilir","Ayrı-ayrı firmaların bazar qiymətinə təsiri yoxdur","Bazara giriş üçün əhəmiyyətli maneələr mövcuddur"],"a":2,"e":"Təkmil rəqabətdə firmalar qiyməti qəbul edir (price taker), qiymətə təsir edə bilmir.","tag":"Bazar, rəqabət və təkmil rəqabət"},{"q":"Təkmil rəqabət bazarında məhsulun qiyməti 12 AZN-dir. Firma istehsalını 100 vahiddən 101 vahidə artırır. 101-ci məhsulun marjinal gəliri (MR) nə qədərdir?","o":["0 AZN","6 AZN","12 AZN","1 212 AZN"],"a":2,"e":"Təkmil rəqabətdə MR = P = 12 AZN.","tag":"Bazar, rəqabət və təkmil rəqabət"},{"q":"Firmanın marjinal gəliri MR = 10 AZN-dir, marjinal xərclər cədvəldəki kimidir. Firma mənfəətini hansı istehsal həcmində maksimumlaşdıracaq?","o":["20","30","40","50"],"a":2,"e":"MR = MC = 10 → Q = 40 (MC artan hissədədir).","t":{"head":["Q","20","30","40","50"],"rows":[["MC","7","9","10","13"]]},"tag":"Bazar, rəqabət və təkmil rəqabət"},{"q":"Firmanın aylıq göstəriciləri: sabit xərc = 600 AZN, dəyişən xərc = 1 400 AZN, ümumi gəlir = 1 600 AZN. Firma qısa müddətdə hansı qərarı verməlidir?","o":["Fəaliyyətini davam etdirməlidir","Mütləq bağlanmalıdır","Bazarı uzunmüddətli dövrü gözləmədən tərk etməlidir","İstehsalı yalnız mənfəət müsbət olduqda davam etdirməlidir"],"a":0,"e":"TR (1 600) > TVC (1 400): dəyişən xərclər tam, sabit xərclərin 200-ü örtülür. Cari zərər 400, bağlansa 600 olardı → davam etmək sərfəlidir.","tag":"Bazar, rəqabət və təkmil rəqabət"},{"q":"Təkmil rəqabət bazarında hansı bərabərliklər başabaş nöqtəsini ifadə edir?","o":["P = AVC; MR = MC","AR = ATC; MR = MC","P = ATC; MR > MC","TR = TVC; MR = MC"],"a":1,"e":"Başabaş: MR = MC və AR = ATC (sıfır iqtisadi mənfəət). A variantı bağlanma nöqtəsinin şərtidir.","tag":"Bazar, rəqabət və təkmil rəqabət"},{"q":"Təkmil rəqabət bazarında firmanın qısamüddətli təklif əyrisi hansıdır?","o":["MC əyrisinin bütün hissəsi","ATC əyrisinin minimumundan yuxarı hissəsi","MC əyrisinin AVC əyrisindən yuxarıda yerləşən hissəsi","AVC əyrisinin MC əyrisindən yuxarıda yerləşən hissəsi"],"a":2,"e":"Təklif əyrisi — MC əyrisinin AVC-dən yuxarıda yerləşən hissəsi.","tag":"Bazar, rəqabət və təkmil rəqabət"},{"q":"Bazarda çoxlu sayda satıcı fəaliyyət göstərir və firmalar fərqləndirilmiş məhsullar təklif edirlər. Bu bazar ən çox ehtimalla hansı modelə aiddir?","o":["Tam rəqabət","İnhisarçı rəqabət","Oliqopoliya","Xalis inhisar"],"a":1,"e":"Çoxlu satıcı + fərqləndirilmiş məhsul → inhisarçı rəqabət.","tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"Bazarda az sayda iri firma fəaliyyət göstərir və hər firma qərar verərkən rəqiblərinin mümkün reaksiyasını nəzərə alır. Bu bazar ən çox ehtimalla:","o":["Tam rəqabət bazarıdır","İnhisarçı rəqabət bazarıdır","Oliqopoliya bazarıdır","Xalis inhisar bazarıdır"],"a":2,"e":"Az sayda iri firma + rəqiblərin reaksiyasının nəzərə alınması (strateji qarşılıqlı asılılıq) → oliqopoliya.","tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"Yeni firma bazara daxil olmaq istəyir, lakin mövcud şirkətin məhsulu patentlə qorunur və digər firmaların eyni məhsulu istehsal etməsi hüquqi olaraq məhdudlaşdırılır. Giriş maneəsinin əsas mənbəyi hansıdır?","o":["Miqyas iqtisadiyyatı","Hüquqi maneə","Müştəri loyallığı","Yüksək çıxış xərci"],"a":1,"e":"Patent hüquqi maneədir.","tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"Dəmir yolu şirkəti eyni marşrut üzrə standart bileti 80 AZN-ə, tələbələrə isə 50 AZN-ə satır. Bu strategiya hansı qiymət ayrı-seçkiliyi növünə aiddir?","o":["I dərəcəli qiymət ayrı-seçkiliyi","II dərəcəli qiymət ayrı-seçkiliyi","III dərəcəli qiymət ayrı-seçkiliyi","Qiymət liderliyi"],"a":2,"e":"Müştəri qrupları (tələbələr) üzrə fərqli qiymət → III dərəcəli qiymət ayrı-seçkiliyi.","tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"İnhisarçı rəqabət bazarındakı firma uzunmüddətli tarazlıqdadır. Hansı fikir ən düzgündür?","o":["P = MC və iqtisadi mənfəət müsbətdir","P = ATC və iqtisadi mənfəət sıfırdır","P \u003c ATC və iqtisadi mənfəət müsbətdir","P = MR = MC və iqtisadi mənfəət sıfırdır"],"a":1,"e":"Sərbəst giriş-çıxış uzun müddətdə P = ATC və sıfır iqtisadi mənfəət yaradır. D variantı təkmil rəqabətə aiddir; inhisarçı rəqabətdə P > MR.","tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"Oliqopolist firmanın marjinal xərc əyrisi yüksəlir, lakin yeni MC əyrisi MR əyrisindəki şaquli boşluq daxilində qalır. Ən ehtimal olunan nəticə hansıdır?","o":["Qiymət və istehsal mütləq artır","Qiymət artır, istehsal azalır","Qiymət və istehsal həcmi dəyişməyə bilər","Firma bazardan çıxır"],"a":2,"e":"MC MR boşluğu daxilində dəyişəndə MR = MC olan həcm dəyişmir, tələb əyrisindən oxunan qiymət də sabit qalır (sınıq tələb əyrisi).","tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"Kurno modelində fəaliyyət göstərən iki firma haqqında hansı fikir ən düzgündür?","o":["Firmalar qiymət üzrə rəqabət aparır və rəqibin qiymətini dəyişməz qəbul edir","Firmalar istehsal həcmi üzrə rəqabət aparır və rəqibin istehsalını verilmiş qəbul edir","Firmalardan biri əvvəl qərar verir, digəri onu izləyir","Firmalar vahid inhisarçı kimi birgə istehsal qərarı verir"],"a":1,"e":"Kurno: həcm üzrə, eyni vaxtda rəqabət; rəqibin həcmi verilmiş qəbul edilir.","tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"Ştakelberq modelini Kurno modelindən fərqləndirən əsas xüsusiyyət hansıdır?","o":["Ştakelberqdə firmalar qiymət üzrə rəqabət aparır","Ştakelberqdə qərarlar ardıcıl, Kurnoda isə eyni vaxtda qəbul edilir","Kurno modelində yalnız bir firma fəaliyyət göstərir","Ştakelberq modelində firmalar arasında kartel razılaşması var"],"a":1,"e":"Ştakelberqdə qərarlar ardıcıldır (lider → təqibçi), Kurnoda eyni vaxtdadır.","tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"Bazarda dörd firmanın payları: A — 60%, B — 20%, C — 10%, D — 10%. Bazarın HHI göstəricisi neçədir?","o":["0,36","0,40","0,42","0,50"],"a":2,"e":"HHI = 0,6² + 0,2² + 0,1² + 0,1² = 0,36 + 0,04 + 0,01 + 0,01 = 0,42.","tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"SigmaSoft və ThetaTech proqram təminatı bazarında dominant istehsalçılardır. Hər biri “Açıq” (kütləvi bazara yönəlmiş, digər istehsalçılara platforma üçün proqram yazmağa imkan verən) və ya “Qapalı” (yalnız öz tətbiqlərinə icazə verən) arxitektura seçə bilər. Ödəniş matrisi aşağıdadır (S — SigmaSoft, T — ThetaTech). Neş tarazlığını tapın.","o":["SigmaSoft — Açıq, ThetaTech — Açıq","SigmaSoft — Açıq, ThetaTech — Qapalı","SigmaSoft — Qapalı, ThetaTech — Açıq","SigmaSoft — Qapalı, ThetaTech — Qapalı"],"a":1,"e":"ThetaTech üçün “Qapalı” dominantdır (700 > 600; 400 > 300). Buna ən yaxşı cavab olaraq SigmaSoft “Açıq”ı seçir (650 > 600). Neş tarazlığı: SigmaSoft — Açıq, ThetaTech — Qapalı, ödənişlər (650; 700).","t":{"head":["SigmaSoft \\ ThetaTech","Açıq","Qapalı"],"rows":[["Açıq","S 400; T 600","S 650; T 700"],["Qapalı","S 800; T 300","S 600; T 400"]]},"tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"Vahidoğlu və Zeynəlmoon “Mərkəz” və ya “Regional” strategiyasını seçir. Ödəniş matrisi aşağıdadır (V — Vahidoğlu, Z — Zeynəlmoon). Neş tarazlığını tapın.","o":["Vahidoğlu — Mərkəz, Zeynəlmoon — Mərkəz","Vahidoğlu — Mərkəz, Zeynəlmoon — Regional","Vahidoğlu — Regional, Zeynəlmoon — Mərkəz","Vahidoğlu — Regional, Zeynəlmoon — Regional"],"a":3,"e":"Hər iki oyunçu üçün “Regional” dominantdır (700 > 300; 200 > 100). Neş tarazlığı (Regional; Regional) = (200; 200), halbuki (Mərkəz; Mərkəz) hər birinə 300 verərdi — “məhbus dilemması” tipli vəziyyət: Neş tarazlığı birgə optimal deyil.","t":{"head":["Vahidoğlu \\ Zeynəlmoon","Mərkəz","Regional"],"rows":[["Mərkəz","V 300; Z 300","V 100; Z 700"],["Regional","V 700; Z 100","V 200; Z 200"]]},"tag":"Monopoliya, inhisarçı rəqabət və oliqopoliya"},{"q":"Bir ölkədə il ərzində aşağıdakı əməliyyatlar baş verir. Cari ilin ÜDM-inə bu əməliyyatlardan nə qədər daxil ediləcək?\n– yeni tikilmiş mənzil 200 000 manata satılır;\n– iki il əvvəl tikilmiş mənzil 180 000 manata təkrar satılır;\n– ikinci əl mənzilin satışına görə daşınmaz əmlak agentinə 3 000 manat komissiya ödənilir;\n– dövlət əhaliyə 20 000 manat sosial müavinət verir.","o":["200 000 manat","203 000 manat","383 000 manat","403 000 manat"],"a":1,"e":"Yeni mənzil (200 000) + agentin komissiyası (3 000) = 203 000. İkinci əl mənzil cari istehsal deyil, sosial müavinət isə transferdir.","tag":"Makroiqtisadiyyata giriş və AD–AS modeli"},{"q":"Nominal ÜDM bir il ərzində 5%, ümumi qiymət səviyyəsi isə 8% artmışdır. Real ÜDM haqqında hansı nəticə daha düzgündür?","o":["Təxminən 13% artmışdır","Təxminən 8% artmışdır","Təxminən 3% azalmışdır","Dəyişməmişdir"],"a":2,"e":"Real artım ≈ nominal artım − qiymət artımı = 5% − 8% ≈ −3% (dəqiq: 1,05 / 1,08 ≈ 0,972).","tag":"Makroiqtisadiyyata giriş və AD–AS modeli"},{"q":"Ölkədə 5 milyon nəfər məşğul, 500 min nəfər işsiz və 1 milyon nəfər könüllü işsiz var. İşsizlik dərəcəsi təxminən neçə faizdir?","o":["7,7%","9,1%","10,0%","16,7%"],"a":1,"e":"Könüllü işsizlər işçi qüvvəsinə daxil deyil: işçi qüvvəsi = 5 + 0,5 = 5,5 mln → 0,5 / 5,5 ≈ 9,1%.","tag":"Makroiqtisadiyyata giriş və AD–AS modeli"},{"q":"Aşağıdakılardan hansı struktur işsizliyə ən uyğun nümunədir?","o":["Daha yüksək maaşlı iş tapmaq üçün əvvəlki işindən könüllü ayrılan bank əməkdaşı","İqtisadi tənəzzül nəticəsində satışlar azaldığı üçün işdən çıxarılan mağaza əməkdaşı","Neft sektorunda hasilatın mütəmadi daralması ilə işsiz qalan geoloqlar","Turizm mövsümü bitdiyi üçün müvəqqəti işsiz qalan otel əməkdaşı"],"a":2,"e":"Sahənin struktur daralması bacarıq-tələb uyğunsuzluğu yaradır. A — friksion, B — tsiklik, D — mövsümi işsizlikdir.","tag":"Makroiqtisadiyyata giriş və AD–AS modeli"},{"q":"İqtisadiyyatda təbii işsizlik səviyyəsi 5%, faktiki işsizlik də 5%-dir. Bu vəziyyət ən düzgün necə xarakterizə olunur?","o":["İqtisadiyyatda işsizlik yoxdur","İqtisadiyyat tam məşğulluq səviyyəsində ola bilər","İqtisadiyyatda yalnız tsiklik işsizlik mövcuddur","Faktiki istehsal mütləq potensial istehsaldan aşağıdır"],"a":1,"e":"Faktiki işsizlik təbii səviyyəyə bərabərdir → tam məşğulluq (işsizlik sıfır deyil).","tag":"Makroiqtisadiyyata giriş və AD–AS modeli"},{"q":"İşçilər və firmalar il üçün 4% inflyasiya gözləyirlər, faktiki inflyasiya isə 7% olur. Qısamüddətli Filips əyrisi məntiqinə görə hansı nəticə ən çox ehtimal olunur?","o":["İstehsal zəifləyər və işsizlik artar","Məşğulluq arta və işsizlik təbii səviyyədən aşağı düşə bilər","İşsizlik dəyişməz qalmalıdır","Uzunmüddətli Filips əyrisi sağa sürüşər"],"a":1,"e":"Faktiki inflyasiya gözləniləndən yüksəkdir → qısa müddətdə istehsal və məşğulluq artır, işsizlik təbii səviyyədən aşağı düşə bilər.","tag":"Makroiqtisadiyyata giriş və AD–AS modeli"},{"q":"Azərbaycan istehlakçılarının geniş istifadə etdiyi, lakin tamamilə xaricdə istehsal olunan avtomobillərin qiyməti kəskin artır; ölkədə istehsal olunan məhsulların qiymətləri dəyişmir. Hansı göstəricinin artması daha çox ehtimal olunur?","o":["Yalnız ÜDM deflyatoru","Həm CPI, həm də ÜDM deflyatoru eyni dərəcədə","CPI, lakin ÜDM deflyatoru deyil","Nə CPI, nə də ÜDM deflyatoru"],"a":2,"e":"CPI idxal olunan istehlak mallarını əhatə edir, ÜDM deflyatoru isə yalnız daxili istehsalı.","tag":"Makroiqtisadiyyata giriş və AD–AS modeli"},{"q":"Hökumət vergiləri azaldır, eyni zamanda ev təsərrüfatlarının gələcək gəlir gözləntiləri yaxşılaşır. AD–AS modelində ilkin təsir hansıdır?","o":["AD sola sürüşəcək","AD sağa sürüşəcək","AS sola sürüşəcək","AS sağa sürüşəcək"],"a":1,"e":"Vergi azalması və gəlir gözləntilərinin yaxşılaşması istehlakı artırır → AD sağa sürüşür.","tag":"Makroiqtisadiyyata giriş və AD–AS modeli"},{"q":"Enerji və xammal qiymətləri kəskin artır, məcmu tələb dəyişmir. Qısamüddətli AD–AS modelinə görə hansı nəticə daha uyğundur?","o":["AS sağa sürüşür, real ÜDM artır və qiymət səviyyəsi azalır","AD sola sürüşür, real ÜDM və qiymət səviyyəsi azalır","AS sola sürüşür, real ÜDM azalır və qiymət səviyyəsinə yuxarı təzyiq yaranır","LRAS sağa sürüşür və potensial istehsal artır"],"a":2,"e":"Mənfi təklif şoku → AS sola → real ÜDM azalır, qiymət səviyyəsi artır.","tag":"Makroiqtisadiyyata giriş və AD–AS modeli"},{"q":"Məcmu tələb kəskin azalır. Müəssisələr menyu xərcləri, uzunmüddətli müqavilələr və digər nominal sərtliklər səbəbindən qiymətləri və əməkhaqlarını qısa müddətdə tam uyğunlaşdıra bilmir; istehsal və məşğulluq potensialdan aşağı düşür. Bu vəziyyəti ən yaxşı hansı yanaşma izah edir?","o":["Klassik — qiymət və əməkhaqları çevik olduğundan iqtisadiyyat özünü tənzimləyərək potensiala qayıdır","Yeni Keynsçi — nominal sərtliklər və qeyri-təkmil rəqabət səbəbindən AD dəyişiklikləri qısa müddətdə real istehsala və məşğulluğa təsir edir","Yeni klassik — gözlənilən AD dəyişiklikləri rasional gözləntilər şəraitində real istehsalı davamlı artırır","Monetarist — uzunmüddətli real istehsal əsasən AD və fiskal siyasətlə müəyyən olunur"],"a":1,"e":"Nominal sərtliklər (menyu xərcləri, müqavilələr) Yeni Keynsçi yanaşmanın əsas arqumentidir.","tag":"Makroiqtisadiyyata giriş və AD–AS modeli"},{"q":"Biznes tsikllərinin əsas xüsusiyyətlərindən biri hansıdır?","o":["Hər tsikl eyni müddətdə baş verir","Yalnız real ÜDM-dəki dəyişiklikləri əhatə edir","Təkrarlanır, lakin periodik xarakter daşımır","Yalnız iqtisadi daralma dövrlərini ifadə edir"],"a":2,"e":"Tsikllər təkrarlanır, amma müddət, intensivlik və interval hər dəfə fərqlidir.","tag":"Biznes tsiklləri"},{"q":"Faktiki real ÜDM artır, lakin potensial ÜDM-dən daha yavaş artır. Ən düzgün nəticə hansıdır?","o":["Müsbət output gap genişlənir","Mənfi output gap yarana və ya genişlənə bilər","İqtisadiyyat mütləq resessiyadadır","Klassik biznes tsiklinə görə iqtisadiyyat daralır"],"a":1,"e":"Faktiki ÜDM potensialdan yavaş artırsa, fərq mənfi tərəfə dəyişir; bu, mütləq resessiya demək deyil.","tag":"Biznes tsiklləri"},{"q":"İqtisadiyyat tsiklin dib nöqtəsini keçib. İstehlak və biznes xərcləri hələ potensialdan aşağıdır, lakin artmağa başlayır; mənfi output gap daralır. İqtisadiyyat hansı fazadadır?","o":["Genişlənmə","Yavaşlama","Daralma","Bərpa"],"a":3,"e":"Dibdən keçid, potensialdan aşağı, amma artan fəaliyyət və daralan mənfi gap → bərpa.","tag":"Biznes tsiklləri"},{"q":"Aşağıdakılardan hansı yavaşlama (slowdown) mərhələsini ən yaxşı xarakterizə edir?","o":["Mənfi output gap maksimum səviyyəyə çatır","İqtisadi fəaliyyət mütləq azalır","Müsbət output gap yüksəkdir, lakin daralmağa başlayır","İşsizlik dərhal kəskin artır"],"a":2,"e":"Yavaşlamada müsbət gap maksimuma çatıb daralmağa başlayır; fəaliyyət mütləq azalmır, işsizlik dərhal artmır.","tag":"Biznes tsiklləri"},{"q":"İqtisadi daralma başlayarkən şirkətin əmək bazarı üzrə ən ehtimal olunan ilk reaksiyası hansıdır?","o":["Bütün əməkdaşların əməkhaqqını azaltmaq","Əlavə iş saatlarını azaltmaq","Dərhal kütləvi ixtisar aparmaq","Yeni işçilərin əməkhaqqını artırmaq"],"a":1,"e":"Ən əvvəl overtime azaldılır, sonra işə qəbul dondurulur, daha sonra ixtisar başlayır.","tag":"Biznes tsiklləri"},{"q":"Şirkətin satışları gözlənilmədən zəifləyir, lakin istehsal əvvəlki yüksək səviyyədə davam edir. Ən çox hansı dəyişiklik gözlənilir?","o":["Inventory–sales ratio azalacaq","Inventory–sales ratio artacaq","Kapital xərcləri dərhal maksimuma çatacaq","Kredit şərtləri avtomatik yumşalacaq"],"a":1,"e":"Satılmayan məhsul yığılır, satış azalır → ehtiyat–satış nisbəti artır (zəifləmə siqnalı).","tag":"Biznes tsiklləri"},{"q":"İqtisadiyyat güclənir və banklar kredit standartlarını yumşaldır. Kreditlərin həcmi artır, daşınmaz əmlak və digər aktivlərin qiymətləri yüksəlir. Bu vəziyyət ən çox hansı anlayışla əlaqəlidir?","o":["Kredit tsiklinin genişlənməsi","Mənfi output gap","Gecikən iqtisadi indikator","Fiskal multiplikator"],"a":0,"e":"Kredit standartlarının yumşalması, kredit və aktiv qiymətlərinin artması → kredit tsiklinin genişlənməsi.","tag":"Biznes tsiklləri"},{"q":"Aşağıdakılardan hansı qabaqlayıcı (leading) indikator hesab olunur?","o":["İşsizliyin orta müddəti","Vahid əmək xərcləri","Tikinti icazələri","Sənaye istehsalı"],"a":2,"e":"Tikinti icazəsi faktiki tikintidən əvvəl alınır. A və B gecikən, D eyni-vaxtlı göstəricidir.","tag":"Biznes tsiklləri"},{"q":"Analitik müşahidə edir: səhm bazarı yüksəlir, yeni sifarişlər artır, tikinti icazələri artır, istehlakçı gözləntiləri yaxşılaşır. Bu göstəricilərin birlikdə yaxşılaşması ən çox nəyi dəstəkləyir?","o":["Gələcək iqtisadi aktivliyin güclənməsi ehtimalını","Keçmiş iqtisadi artımın artıq başa çatdığını","Cari inflyasiyanın mütləq azalacağını","İqtisadiyyatın artıq resessiyada olduğunu"],"a":0,"e":"Hamısı qabaqlayıcı göstəricilərdir → gələcək aktivliyin güclənməsinə işarədir.","tag":"Biznes tsiklləri"},{"q":"Kompozit qabaqlayıcı indeksin 10 komponentindən 3-ü yüksəlir. Sadələşdirilmiş diffusion index yanaşmasına görə indeks neçədir?","o":["30%","50%","70%","700%"],"a":0,"e":"Diffusion index = 3 / 10 × 100 = 30%.","tag":"Biznes tsiklləri"},{"q":"İqtisadiyyatda tənəzzül müşahidə olunur və hökumət məcmu tələbi artırmaq istəyir. Hansı tədbir genişləndirici fiskal siyasətə ən uyğundur?","o":["Dövlət xərclərinin azaldılması və vergilərin artırılması","Dövlət xərclərinin artırılması və vergilərin azaldılması","Siyasət faizinin artırılması","Bankların məcburi ehtiyat normasının artırılması"],"a":1,"e":"G ↑ və T ↓ → AD ↑. C və D variantları monetar alətlərdir.","tag":"Fiskal siyasət"},{"q":"Fiskal siyasətlə monetar siyasət arasındakı əsas fərq hansıdır?","o":["Fiskal siyasəti mərkəzi bank, monetar siyasəti hökumət həyata keçirir","Hər iki siyasətin əsas aləti vergi dərəcəsidir","Fiskal siyasətin əsas alətləri dövlət xərcləri və vergilər, monetar siyasətin əsas alətlərindən biri isə siyasət faizidir","Monetar siyasət yalnız gəlir bölgüsünə təsir edir"],"a":2,"e":"Fiskal siyasəti hökumət (G, T), monetar siyasəti mərkəzi bank (siyasət faizi və s.) həyata keçirir.","tag":"Fiskal siyasət"},{"q":"Hökumət dövlət xərclərini 100 mln manat azaldır, eyni zamanda vergiləri 250 mln manat azaldır. Ən düzgün yanaşma hansıdır?","o":["Siyasət mütləq daraldıcıdır, çünki dövlət xərcləri azalıb","Siyasət mütləq genişləndiricidir, çünki vergilər azalıb","Fiskal paketin ümumi xalis təsiri qiymətləndirilməlidir","Vergi dəyişiklikləri məcmu tələbə təsir etmir"],"a":2,"e":"Paketin xalis təsiri qiymətləndirilir; bu halda vergi endirimi daha böyük olduğu üçün yekun təsir genişləndirici ola bilər.","tag":"Fiskal siyasət"},{"q":"Ölkədə real artım tempi 2%, dövlət borcu üzrə real faiz dərəcəsi isə 6%-dir. Digər şərtlər dəyişməz qalarsa, ən mümkün nəticə hansıdır?","o":["Borcun dayanıqlılığı avtomatik yaxşılaşacaq","Borc iqtisadiyyatdan daha sürətli arta bilər","Borc/ÜDM nisbəti mütləq azalacaq","Dövlət borcunun real yükü sıfırlanacaq"],"a":1,"e":"Real faiz (6%) artımdan (2%) yüksəkdir → borc iqtisadiyyatdan sürətli artır, borc/ÜDM yüksələ bilər.","tag":"Fiskal siyasət"},{"q":"Digər şərtlər dəyişməz qalmaqla inflyasiyanın artması mövcud nominal dövlət borcuna necə təsir edə bilər?","o":["Borcun real yükünü azalda bilər","Borcun real yükünü mütləq artırır","Nominal ÜDM-i azaldır","Dövlət borcunun məbləğini avtomatik sıfırlayır"],"a":0,"e":"İnflyasiya nominal ÜDM-i artırır, nominal borcun real yükü azalır.","tag":"Fiskal siyasət"},{"q":"Hökumət vergiləri azaldaraq fiskal stimul verir, lakin ev təsərrüfatları gələcəkdə vergilərin artırılacağını gözləyərək əlavə gəliri xərcləmək əvəzinə yığırlar. Bu vəziyyət hansı anlayışla izah olunur?","o":["Laffer effekti","Crowding out","Rikardo ekvivalentliyi","Avtomatik stabilləşdirmə"],"a":2,"e":"Gələcək vergi artımı gözləntisi ilə yığım → Rikardo ekvivalentliyi.","tag":"Fiskal siyasət"},{"q":"Dövlət borclanmasının artması maliyyə resurslarına tələbi yüksəldir, faizlər artır və bəzi özəl investisiya layihələri təxirə salınır. Bu hadisə necə adlanır?","o":["Crowding out","Automatic stabilization","Ricardian equivalence","Seigniorage"],"a":0,"e":"Dövlət borclanması → faiz ↑ → özəl investisiya ↓ → crowding out.","tag":"Fiskal siyasət"},{"q":"Crowding out effektinin hansı şəraitdə daha güclü olması gözlənilir?","o":["Yüksək işsizlik və böyük istifadə olunmayan potensial olduqda","İqtisadiyyat tam istehsal gücünə yaxın işlədikdə","Özəl investisiyalar sıfır olduqda","Dövlət heç bir borclanma aparmadıqda"],"a":1,"e":"Tam gücə yaxın iqtisadiyyatda resurslar məhduddur → dövlət tələbi özəl sektoru daha güclü sıxışdırır.","tag":"Fiskal siyasət"},{"q":"Aşağıdakılardan hansı dolayı vergi nümunəsidir?","o":["Mənfəət vergisi","Gəlir vergisi","Əmlak vergisi","Əlavə dəyər vergisi"],"a":3,"e":"ƏDV mal və xidmətlərin istehlakı üzərindən tutulur → dolayı vergi.","tag":"Fiskal siyasət"},{"q":"Eyni iqtisadi vəziyyətdə olan şəxslərin oxşar məbləğdə vergi ödəməsi hansı prinsipə aiddir?","o":["Şaquli ədalətlilik","Üfüqi ədalətlilik","Gəlirlərin yetərliliyi","Reqressivlik"],"a":1,"e":"Oxşar vəziyyətdə oxşar vergi → üfüqi ədalət.","tag":"Fiskal siyasət"},{"q":"Dövlət satınalmaları 120 mln manat artırılır. MPC = 0,75, xalis vergi dərəcəsi isə 0,20-dir. ÜDM-də yekun dəyişiklik nə qədər olar?","o":["120 mln manat","240 mln manat","300 mln manat","480 mln manat"],"a":2,"e":"k = 1 / (1 − 0,75 × 0,8) = 1 / 0,4 = 2,5 → ΔY = 2,5 × 120 = 300 mln manat.","tag":"Fiskal siyasət"},{"q":"Dövlət satınalmaları 100 mln manat azaldılır. Yığıma meyillilik (MPS) 0,20, xalis vergi dərəcəsi 0,30-dur. ÜDM-də təxminən hansı dəyişiklik baş verər?","o":["100 mln manat azalma","125 mln manat azalma","227,3 mln manat azalma","350 mln manat azalma"],"a":2,"e":"c = 1 − 0,2 = 0,8; k = 1 / (1 − 0,8 × 0,7) = 1 / 0,44 ≈ 2,27 → ΔY ≈ −227,3 mln manat.","tag":"Fiskal siyasət"},{"q":"İqtisadiyyat resessiyaya daxil olur: işsizlik artır, sosial ödənişlər yüksəlir, gəlirlər azaldığı üçün vergi daxilolmaları düşür. Hökumət bunun üçün ayrıca qərar qəbul etməyib. Bu, hansı anlayışa nümunədir?","o":["Diskresion fiskal siyasət","Avtomatik stabilizatorlar","Crowding out","Laffer effekti"],"a":1,"e":"Ayrıca qərar olmadan işləyən mexanizm → avtomatik stabilizatorlar.","tag":"Fiskal siyasət"},{"q":"Resessiya nəticəsində vergi daxilolmalarının azalması və sosial transferlərin artması səbəbindən büdcə kəsiri böyüyür. Hansı fikir ən düzgündür?","o":["Kəsirin artması mütləq hökumətin yeni genişləndirici qərar verdiyini göstərir","Kəsirdəki artım iqtisadi tsiklin avtomatik nəticəsi ola bilər","Büdcə kəsiri yalnız vergilər artırıldıqda böyüyür","Avtomatik stabilizatorlar büdcəyə təsir etmir"],"a":1,"e":"Kəsir tsiklin özündən (avtomatik stabilizatorlardan) qaynaqlana bilər.","tag":"Fiskal siyasət"},{"q":"Hökumət iqtisadiyyatın zəiflədiyini gec müəyyən edir; tədbirin parlament və inzibati prosedurlardan keçməsi vaxt aparır; icradan sonra təsir də dərhal görünmür. Hansı gecikmələr ardıcıllığı mövcuddur?","o":["Impact lag → Recognition lag → Action lag","Action lag → Impact lag → Recognition lag","Recognition lag → Action lag → Impact lag","Recognition lag → Impact lag → Action lag"],"a":2,"e":"Tanıma → qərar və icra → təsir.","tag":"Fiskal siyasət"},{"q":"Müştəri manatla tələb olunanadək depozitindəki 200 000 AZN-i manatla müddətli depozitə köçürür; digər komponentlər dəyişmir. Azərbaycanın pul aqreqatlarına əsasən hansı nəticə doğrudur?","o":["M1, M2 və M3 hər biri 200 000 AZN azalır","M1 200 000 AZN azalır, M2 və M3 dəyişmir","M1 dəyişmir, M2 və M3 hər biri 200 000 AZN artır","M1 və M2 hər biri 200 000 AZN azalır, M3 dəyişmir"],"a":1,"e":"Tələbli manat depoziti M1-ə daxildir, müddətli manat depoziti isə M2-yə (M1-dən kənar). Vəsait M2 daxilində yer dəyişdiyi üçün M1 −200 000, M2 və M3 dəyişmir.","tag":"Pul və pul siyasəti"},{"q":"Sadələşdirilmiş modeldə bank sisteminə 200 000 AZN ilkin depozit və eyni həcmdə yeni ehtiyat daxil olur. Məcburi ehtiyat norması 20%-dir; banklar bütün artıq ehtiyatları kreditə yönəldir və digər məhdudiyyətlər yoxdur. İlkin depozitdən əlavə yarana biləcək depozitlərin nəzəri maksimumu nə qədərdir?","o":["160 000 AZN","1 000 000 AZN","40 000 AZN","800 000 AZN"],"a":3,"e":"m = 1 / 0,2 = 5 → maksimum depozit 200 000 × 5 = 1 000 000; ilkin depozitdən əlavə 800 000 AZN.","tag":"Pul və pul siyasəti"},{"q":"Mərkəzi bank kommersiya banklarına 50 mln AZN dəyərində dövlət istiqrazı satır. Digər şərtlər sabit qaldıqda ən ehtimal olunan nəticə hansıdır?","o":["Bankların pul ehtiyatları artır və qısamüddətli faizlərə azaldıcı təzyiq yaranır","Bankların pul ehtiyatları azalır və qısamüddətli faizlərə azaldıcı təzyiq yaranır","Bankların pul ehtiyatları azalır və qısamüddətli faizlərə artırıcı təzyiq yaranır","Bankların pul ehtiyatları artır və qısamüddətli faizlərə artırıcı təzyiq yaranır"],"a":2,"e":"İstiqraz satışı bankların ehtiyatlarını çəkir → likvidlik azalır → qısamüddətli faizlər artmağa meyl edir.","tag":"Pul və pul siyasəti"},{"q":"Faiz artımından sonra daşınmaz əmlak qiymətləri azalır. Borcalan şirkətlərin əməliyyat gəlirləri və mövcud kreditlərinin faizləri dəyişməsə də, banklar onların kredit limitlərini aşağı salır. Bu nəticəni ən yaxşı izah edən mexanizm hansıdır?","o":["Cari faiz xərclərinin artması borca xidmət imkanını zəiflədir","Girovların dəyərinin azalması şirkətlərin borclanma imkanını məhdudlaşdırır","Cari əməliyyat gəlirlərinin azalması ödəmə qabiliyyətini zəiflədir","Məcburi ehtiyat normasının yüksəlməsi bankların sərbəst likvidliyini azaldır"],"a":1,"e":"Aktiv qiymətləri kanalı: girov dəyəri azalır → borclanma imkanı məhdudlaşır (gəlir və faiz dəyişməyib).","tag":"Pul və pul siyasəti"},{"q":"Üzən məzənnə rejimində siyasət faizinin artırılması milli valyutanın möhkəmlənməsinə səbəb olur; xarici valyutada məhsul qiymətləri dəyişmir. Qiymət və tələb ötürülməsi normal işlədikdə hansı nəticə gözlənilir?","o":["İdxalın milli valyutada qiyməti yüksəlir, xalis ixrac azalır","İdxalın milli valyutada qiyməti azalır, xalis ixrac artır","İdxalın milli valyutada qiyməti yüksəlir, xalis ixrac artır","İdxalın milli valyutada qiyməti azalır, xalis ixrac azalır"],"a":3,"e":"Möhkəm milli valyuta → idxal milli valyutada ucuzlaşır (idxal artır), ixrac xaricilər üçün bahalaşır → xalis ixrac azalır.","tag":"Pul və pul siyasəti"},{"q":"Hökumət inflyasiya hədəfini 3% müəyyən edir. Mərkəzi bank bu hədəfi dəyişə bilmir, lakin hədəfə çatmaq üçün siyasət faizini və açıq bazar əməliyyatlarını müstəqil seçir. Bu çərçivə hansı müstəqilliyi göstərir?","o":["Əməliyyat müstəqilliyini, lakin hədəf müstəqilliyini deyil","Həm hədəf, həm də əməliyyat müstəqilliyini","Hədəf müstəqilliyini, lakin əməliyyat müstəqilliyini deyil","Nə hədəf, nə də əməliyyat müstəqilliyini"],"a":0,"e":"Hədəfi hökumət seçir (hədəf müstəqilliyi yoxdur), alətləri bank seçir (əməliyyat müstəqilliyi var).","tag":"Pul və pul siyasəti"},{"q":"İnflyasiya hədəfi 3%, cari illik inflyasiya 2%-dir. Kredit və məcmu tələbin sürətli artımı səbəbindən siyasət dəyişməz qalarsa, 18 ay sonra inflyasiyanın 5%-ə yüksələcəyi proqnozlaşdırılır. Pul siyasətinin inflyasiyaya əsas təsiri də təxminən 18 ay gecikmə ilə yaranır. Hansı qərar daha əsaslıdır?","o":["Cari inflyasiya 3%-i keçənədək sərtləşdirməni təxirə salmaq","Cari inflyasiya hədəfdən aşağı olduğuna görə siyasət faizini azaltmaq","Gələcək inflyasiya təzyiqini azaltmaq üçün siyasəti indidən sərtləşdirmək","İnflyasiya hədəfini proqnozlaşdırılan 5%-ə yüksəltmək"],"a":2,"e":"Siyasət gələcək inflyasiyaya yönəlir; təsir 18 ay gecikdiyi üçün sərtləşdirmə indidən başlamalıdır.","tag":"Pul və pul siyasəti"},{"q":"Enerji idxal edən ölkədə dünya enerji qiymətlərinin artması cari inflyasiyanı 2%-dən 6%-ə yüksəldir və iqtisadi aktivliyi zəiflədir. Şokun müvəqqəti olacağı, ortamüddətli inflyasiyanın 2%-lik hədəfə qayıdacağı proqnozlaşdırılır; əməkhaqqı artımı və inflyasiya gözləntiləri hədəfə uyğundur. Hansı yanaşma daha əsaslıdır?","o":["İnflyasiyanı dərhal 2%-ə qaytarmaq üçün siyasət faizini kəskin artırmaq","Ortamüddətli proqnozu əsas götürüb siyasət faizini dəyişmədən vəziyyəti izləmək","İqtisadi aktivliyi qorumaq üçün inflyasiya hədəfini 6%-ə yüksəltmək","İqtisadi zəifləməni aradan qaldırmaq üçün siyasət faizini kəskin azaltmaq"],"a":1,"e":"Müvəqqəti təklif şoku, gözləntilər sabitdir → kəskin faiz artımı zəifləməni dərinləşdirər; ortamüddətli proqnoz əsasında izləmək məqsədəuyğundur.","tag":"Pul və pul siyasəti"},{"q":"Mərkəzi bank sabit məzənnəni qorumaq üçün banklara 120 mln ABŞ dolları satır (1 USD = 1,70 AZN). Banklar qarşılığını manat ehtiyat hesablarından ödəyir, likvidlik təsiri kompensasiya edilmir. Hansı nəticə doğrudur?","o":["Valyuta ehtiyatları 120 mln USD azalır, manat likvidliyi 204 mln AZN artır","Valyuta ehtiyatları 120 mln USD artır, manat likvidliyi 204 mln AZN azalır","Valyuta ehtiyatları 120 mln USD, manat likvidliyi 204 mln AZN artır","Valyuta ehtiyatları 120 mln USD, manat likvidliyi 204 mln AZN azalır"],"a":3,"e":"120 × 1,70 = 204 mln AZN. Dollar satışında ehtiyatlar 120 mln USD azalır, banklar manat ödədiyi üçün manat likvidliyi 204 mln AZN azalır.","tag":"Pul və pul siyasəti"},{"q":"Mərkəzi bank banklardan 80 mln ABŞ dolları alır və qarşılığını 1 USD = 1,70 AZN məzənnəsi ilə manatla ödəyir. Sonra banklara 100 mln AZN dəyərində not sataraq bu məbləği likvidlikdən çıxarır. Bank sisteminin manat likvidliyində yekun dəyişiklik nə qədərdir?","o":["36 mln AZN artım","36 mln AZN azalma","136 mln AZN artım","100 mln AZN azalma"],"a":0,"e":"80 × 1,70 = +136 mln AZN; not satışı −100 mln → xalis +36 mln AZN.","tag":"Pul və pul siyasəti"},{"q":"Sabit məzənnə və sərbəst kapital hərəkəti olan ölkədə mərkəzi bank daxili iqtisadiyyatı stimullaşdırmaq üçün faizləri aşağı salır. Xarici faizlər, risk mükafatı və məzənnə gözləntiləri dəyişmir. Hansı nəticə daha çox gözlənilir?","o":["Kapital daxilolmaları güclənir və məzənnəni qorumaq üçün valyuta alışları tələb oluna bilər","Kapital çıxışı güclənir və məzənnəni qorumaq üçün valyuta satışları tələb oluna bilər","Kapital çıxışı güclənir və məzənnəni qorumaq üçün valyuta alışları tələb oluna bilər","Kapital daxilolmaları güclənir və məzənnəni qorumaq üçün valyuta satışları tələb oluna bilər"],"a":1,"e":"Aşağı daxili faiz → kapital çıxışı → milli valyutaya ucuzlaşma təzyiqi → pariteti qorumaq üçün mərkəzi bank valyuta satmalıdır.","tag":"Pul və pul siyasəti"},{"q":"Sadələşdirilmiş yanaşmaya görə real trend artımı 2,5%, uzunmüddətli gözlənilən inflyasiya 2%-dir. Mərkəzi bank nominal siyasət faizini 7%-dən 6%-ə endirir. Yeni faiz səviyyəsində siyasətin xarakteri necədir?","o":["Genişləndiricidir, çünki nominal neytral faiz 8%-ə bərabərdir","Genişləndiricidir, çünki siyasət faizində istənilən azalma genişləndirici siyasətdir","Daraldıcıdır, çünki 6%-lik siyasət faizi 4,5%-lik nominal neytral faizdən yüksəkdir","Neytraldır, çünki faizdəki azalma əvvəlki sərtləşməni tam kompensasiya edir"],"a":2,"e":"Neytral faiz = 2,5% + 2% = 4,5%; 6% > 4,5% → siyasət hələ də daraldıcıdır.","tag":"Pul və pul siyasəti"},{"q":"Mərkəzi bank siyasət faizini azaldır. Buna baxmayaraq, uzunmüddətli dövlət istiqrazlarının qiymətləri düşür və gəlirlilikləri yüksəlir; dövlətin kredit riski dəyişmir. Hansı bazar gözləntisi bu nəticəyə daha çox uyğundur?","o":["Gələcək inflyasiyanın yüksələcəyi gözləntisi ilə uzunmüddətli istiqrazlara tələbin azalması","Gələcək siyasət faizlərinin daha da azalacağı gözləntisi ilə uzunmüddətli istiqrazlara tələbin artması","İqtisadi tənəzzül gözləntisi ilə uzunmüddətli dövlət istiqrazlarına tələbin artması","Gələcək inflyasiyanın azalacağı gözləntisi ilə uzunmüddətli istiqrazlara tələbin artması"],"a":0,"e":"Uzun istiqrazların ucuzlaşması (gəlirlilik ↑) yüksək inflyasiya gözləntisinə uyğundur. B, C və D istiqraz qiymətlərini artırardı.","tag":"Pul və pul siyasəti"},{"q":"Mərkəzi bank iki ayrı ssenaridə 100 mln AZN dəyərində istiqraz alır. Başqa əməliyyat aparılmadıqda dərhal nəticəni hansı fikir düzgün göstərir?\nI ssenari: istiqraz kommersiya bankının öz portfelindən alınır, ödəniş onun ehtiyat hesabına daxil olur.\nII ssenari: istiqraz bank olmayan rezident investordan alınır, ödəniş onun bank depozitinə daxil olur.","o":["Hər iki ssenaridə həm bank ehtiyatları, həm də müştəri depozitləri 100 mln AZN artır","Hər iki ssenaridə bank ehtiyatları 100 mln AZN artır, müştəri depozitləri isə dəyişmir","Hər iki ssenaridə bank ehtiyatları artır, müştəri depozitləri isə yalnız II ssenaridə 100 mln AZN artır","Bank ehtiyatları yalnız I ssenaridə, müştəri depozitləri isə yalnız II ssenaridə 100 mln AZN artır"],"a":2,"e":"I: ehtiyat +100, depozit dəyişmir. II: investorun depoziti +100 və onun bankının ehtiyatı +100.","tag":"Pul və pul siyasəti"},{"q":"AZN/USD məzənnəsi 1,70-dən 1,80-ə yüksəlir. ABŞ və Azərbaycan qiymətləri dəyişmir. Real məzənnəyə nə olur?","o":["Real məzənnə artır","Real məzənnə azalır","Real məzənnə dəyişmir"],"a":0,"e":"Dollar bahalaşır, qiymətlər dəyişmir → ABŞ malları manatla bahalaşır → real məzənnə artır.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"AZN/USD məzənnəsi sabitdir. ABŞ-da qiymətlər 8%, Azərbaycanda 3% artır. Real məzənnə necə dəyişir?","o":["Təxminən 5% azalır","Təxminən 5% artır","11% artır"],"a":1,"e":"%ΔR ≈ 0% + 8% − 3% = +5%.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Nominal məzənnə və ABŞ qiymətləri sabitdir, Azərbaycanda qiymətlər 10% artır. Hansı fikir doğrudur?","o":["Dollar manat qarşısında nominal olaraq ucuzlaşır","ABŞ məhsulları yerli məhsullara nəzərən ucuzlaşır","Amerikalıların dollar gəlirinin alıcılıq qabiliyyəti nominal olaraq artır"],"a":1,"e":"Azərbaycanda qiymətlər artdığı üçün ABŞ malları yerli mallara nəzərən ucuzlaşır; bu, dolların nominal ucuzlaşması demək deyil.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Nominal AZN/USD məzənnəsi 10%, ABŞ-da qiymətlər 5%, Azərbaycanda 2% artır. Real məzənnə təxminən neçə faiz dəyişir?","o":["7% artır","13% artır","17% artır"],"a":1,"e":"%ΔR ≈ 10% + 5% − 2% = +13%.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Ticarət kəsiri olan ölkədə hansının baş verməsi daha çox ehtimal olunur? (Sadələşdirilmiş model)","o":["Kəsiri maliyyələşdirən xalis kapital daxilolması maliyyə hesabında əks olunacaq","Ölkənin yığımları investisiya xərclərini tam maliyyələşdirəcək","Ölkə kəsiri maliyyələşdirmək üçün xaricilərdən aktivlər alacaq"],"a":0,"e":"Kəsir xarici maliyyələşmə (xalis kapital daxilolması) tələb edir; ölkə xaricilərə aktiv satır, onlardan almır.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Azərbaycan rezidenti olan şirkət xarici müəssisənin səhmlərinin 8%-ni 2 mln ABŞ dollarına alır, bir il sonra bu səhmlərə görə 120 min dollar dividend əldə edir. Əməliyyatların tədiyə balansında ən düzgün təsnifatı hansıdır?","o":["Hər iki əməliyyat cari hesabda əks olunur","Səhm alışı maliyyə hesabında portfel investisiyası, dividend cari hesabın ilkin gəlirlər maddəsində əks olunur","Səhm alışı kapital hesabında, dividend maliyyə hesabında qeydə alınır","Səhm alışı maliyyə hesabında birbaşa investisiya, dividend cari hesabın ilkin gəlirlər maddəsində əks olunur"],"a":1,"e":"8% \u003c 10% → birbaşa deyil, portfel investisiyası (maliyyə hesabı); dividend — cari hesabın ilkin gəlirləri.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Ölkənin göstəriciləri: mal ixracı 850 mln $, mal idxalı 1 020 mln $, xidmət ixracı 240 mln $, xidmət idxalı 160 mln $, xalis ilkin gəlirlər −65 mln $, xalis ikinci dərəcəli gəlirlər +45 mln $. Cari hesabın saldosu nə qədərdir?","o":["+110 mln $","−155 mln $","−110 mln $","+200 mln $"],"a":2,"e":"Mallar 850 − 1 020 = −170; xidmətlər 240 − 160 = +80; −170 + 80 − 65 + 45 = −110 mln $.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Azərbaycan şirkəti Almaniyadan 500 min avroluq avadanlıq idxal edir; ödəniş altı ay sonra ediləcək. Tədiyə balansında ilkin qeydlər hansı variantda düzgündür?","o":["Cari hesabda mal idxalı və maliyyə hesabında xarici öhdəliyin artması","Cari hesabda mal idxalı və ehtiyat aktivlərinin dərhal azalması","Kapital hesabında avadanlığın alınması və cari hesabda kredit daxilolması","Maliyyə hesabında yalnız xarici aktivin artması"],"a":0,"e":"İkili yazılış: mal idxalı (cari hesab) + ödənilməmiş məbləğ, yəni ticarət krediti (maliyyə hesabında öhdəlik artımı).","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Hesabat dövründə xarici maliyyə aktivlərinin xalis əldə edilməsi 420 mln $, xarici maliyyə öhdəliklərinin xalis yaranması 610 mln $ təşkil edib. Maliyyə hesabının xalis saldosu hansıdır?","o":["+1 030 mln $","+190 mln $","−610 mln $","−190 mln $"],"a":3,"e":"420 − 610 = −190 mln $.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Mərkəzi Bankın ehtiyat aktivləri ilin əvvəlində 8,0 mlrd $ təşkil edir. İl ərzində valyuta aktivlərinin alınması hesabına 600 mln $ artım, qızılın qiyməti və məzənnə dəyişiklikləri hesabına 150 mln $ azalma baş verir. Hansı fikir düzgündür?","o":["Yekun qalıq 8,60 mlrd $, maliyyə hesabındakı artım 450 mln $-dır","Yekun qalıq 8,45 mlrd $, əməliyyatlar üzrə artım 600 mln $-dır","Yekun qalıq 8,45 mlrd $, əməliyyatlar üzrə artım 450 mln $-dır","Yekun qalıq 7,55 mlrd $, maliyyə hesabında azalma 150 mln $-dır"],"a":1,"e":"Yekun 8,0 + 0,6 − 0,15 = 8,45 mlrd $. Maliyyə hesabı yalnız əməliyyatları (+600 mln $) əks etdirir; −150 mln $ qiymətləndirmə dəyişməsidir.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"AZN/USD məzənnəsi 1,70-dən 1,85-ə yüksəlir. Həmin dövrdə manatın dollar qarşısında faizlə dəyərsizləşməsi təxminən nə qədərdir?","o":["8,82%","8,11%","9,68%","15,00%"],"a":1,"e":"Manatın dəyişməsi = 1,70 / 1,85 − 1 ≈ −8,11%. (8,82% — dolların bahalaşmasıdır.)","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"AZN/USD nominal məzənnəsi il ərzində 6% artır. Eyni dövrdə ABŞ-da inflyasiya 3%, Azərbaycanda 9% olur. Təxmini real məzənnə düsturuna görə real AZN/USD məzənnəsi necə dəyişir?","o":["12% artır","6% azalır","Dəyişmir","3% azalır"],"a":2,"e":"%ΔR ≈ 6% + 3% − 9% = 0 → real məzənnə dəyişmir.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"PPP-yə görə Azərbaycanda gözlənilən inflyasiya 11%, ABŞ-da 3%-dir. Digər amillər sabit qaldıqda AZN/USD məzənnəsinin gözlənilən dəyişməsi hansıdır?","o":["Təxminən 8% yüksəlmə","Təxminən 8% azalma","Təxminən 14% yüksəlmə","Dəyişməmə"],"a":0,"e":"İnflyasiya fərqi 11% − 3% = 8% → manat ≈8% ucuzlaşır, AZN/USD ≈8% yüksəlir.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Azərbaycan şirkəti üç ay sonra 500 000 ABŞ dolları ödəməlidir və 1 USD = 1,74 AZN forvard məzənnəsi ilə dollar almaq öhdəliyi götürür. Üç ay sonra spot məzənnə 1,83 olur. Forvard spot bazardan alışla müqayisədə nə qədər qənaət təmin edir?","o":["45 000 AZN","87 000 AZN","915 000 AZN","0 AZN"],"a":0,"e":"(1,83 − 1,74) × 500 000 = 45 000 AZN.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"İdxalçı üç ay sonra 100 000 ABŞ dolları almalıdır. O, 1 USD = 1,75 AZN icra qiymətli dollar call opsionu alır; mükafat hər dollar üçün 0,03 AZN-dir. Müddət sonunda spot 1,68 olarsa, şirkətin dolları əldə etmək üzrə ümumi manat xərci nə qədərdir?","o":["175 000 AZN","171 000 AZN","168 000 AZN","178 000 AZN"],"a":1,"e":"Spot (1,68) icra qiymətindən (1,75) aşağıdır → opsion icra edilmir: 100 000 × 1,68 = 168 000 + mükafat 100 000 × 0,03 = 3 000 → 171 000 AZN.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Azərbaycan bankının üç ay müddətinə dollar likvidliyinə ehtiyacı var, lakin dollar mövqeyini daimi artırmaq istəmir. Bank eyni anda spot bazarda dollar alır və üç ay sonra geri satmaq üçün forvard müqaviləsi bağlayır. Bu hansı əməliyyatdır?","o":["Opsion","Forvard","Spot","Svop"],"a":3,"e":"Spot alış + əks istiqamətdə forvard = svop.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Milli valyuta xarici valyutaya hüquqi öhdəlik əsasında sabit məzənnə ilə bağlanır və milli pul emissiyası tam xarici ehtiyat təminatı ilə məhdudlaşdırılır. Bu rejim necə adlanır?","o":["İdarə olunan üzən məzənnə","Valyuta şurası (Currency Board)","Hədəf diapazonu (Target Zone)","Müstəqil üzən məzənnə"],"a":1,"e":"Qanuni öhdəlik + monetar bazanın tam ehtiyat təminatı → valyuta şurası.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Sabit məzənnə rejimli ölkədə investorlar milli valyutada aktivlərini kütləvi sataraq dollar almağa başlayır. Mərkəzi Bankın elan edilmiş pariteti qorumaq üçün ən uyğun ilkin bazar əməliyyatı hansıdır?","o":["Milli valyuta alıb rəsmi ehtiyatlardan dollar satmaq","Milli valyuta satıb rəsmi ehtiyatlara dollar almaq","Dollar satışını dayandırıb məzənnəni tam sərbəst buraxmaq","Yalnız dövlət istiqrazlarının buraxılışını artırmaq"],"a":0,"e":"Dollara tələb artır → mərkəzi bank ehtiyatlardan dollar satır və milli valyutanı alır.","tag":"Tədiyə balansı və valyuta bazarı"},{"q":"Sadələşdirilmiş açıq 74,79,84,89,94,99]],"qs":[{"q":"1 000 AZN illik 10% mürəkkəb faizlə 2 il yerləşdirilir. Gələcək dəyər nə qədərdir?","o":["1 200 AZN","1 100 AZN","1 210 AZN","1 221 AZN"],"a":2,"e":"FV = 1 000 × 1,1² = 1 210 AZN. Sadə faizlə 1 200 AZN olardı."},{"q":"İllik nominal faiz 12%, faiz aylıq hesablanır. Effektiv illik faiz təxminən neçədir?","o":["12,00%","12,36%","12,68%","13,00%"],"a":2,"e":"EAR = (1 + 0,12/12)¹² − 1 = 1,01¹² − 1 ≈ 12,68%."},{"q":"Hər il sonsuza qədər 100 AZN ödəyən perpetuitetin 8% diskont dərəcəsində cari dəyəri nə qədərdir?","o":["800 AZN","1 080 AZN","1 250 AZN","925,93 AZN"],"a":2,"e":"PV = PMT / r = 100 / 0,08 = 1 250 AZN."},{"q":"3 il ərzində hər ilin sonunda 1 000 AZN ödəyən annuitetin 10% faizlə cari dəyəri təxminən nə qədərdir?","o":["2 486,85 AZN","3 000,00 AZN","2 735,54 AZN","3 310,00 AZN"],"a":0,"e":"PV = 1 000 × [1 − 1,1^(−3)] / 0,1 ≈ 2 486,85 AZN. 3 310 AZN isə annuitetin gələcək dəyəridir."},{"q":"Daxili gəlirlilik norması (IRR) nədir?","o":["Kapitalın orta çəkili dəyəri","Layihənin NPV-sini sıfıra bərabər edən diskont dərəcəsi","İlkin investisiyanın geri qayıtma müddəti","Mühasibat mənfəətinin investisiyaya nisbəti"],"a":1,"e":"IRR kapitalın dəyərindən yüksəkdirsə, layihə qəbul edilə bilər."},{"q":"Kredit faizi 10%, mənfəət vergisinin dərəcəsi 20%-dir. Borcun vergidən sonrakı dəyəri neçədir?","o":["10%","8%","12%","2%"],"a":1,"e":"kd × (1 − t) = 10% × 0,8 = 8%."},{"q":"Risksiz faiz 5%, səhmin betası 1,2, bazar risk mükafatı 6%-dir. CAPM-ə görə səhmdar kapitalının dəyəri neçədir?","o":["11,0%","12,2%","13,4%","7,2%"],"a":1,"e":"ke = 5% + 1,2 × 6% = 12,2%."},{"q":"Gələn il gözlənilən dividend 2 AZN, səhmin qiyməti 40 AZN, dividendin sabit artım tempi 5%-dir. Gordon modelinə görə səhmdar kapitalının dəyəri neçədir?","o":["5%","15%","10%","7,5%"],"a":2,"e":"ke = D₁ / P₀ + g = 2 / 40 + 5% = 10%."},{"q":"Kapital strukturu 40% borcdan (vergidən sonra 8%) və 60% səhmdar kapitalından (12%) ibarətdir. WACC neçədir?","o":["10,0%","9,6%","10,4%","20,0%"],"a":2,"e":"WACC = 0,4 × 8% + 0,6 × 12% = 3,2% + 7,2% = 10,4%."},{"q":"Şirkət yeni layihəni qiymətləndirərkən keçən il ödənilmiş 50 000 AZN-lik bazar araşdırması xərcini necə nəzərə almalıdır?","o":["Pul axınlarına xərc kimi daxil etməlidir","Diskont dərəcəsinə əlavə etməlidir","Batmış xərc olduğu üçün nəzərə almamalıdır","Layihənin gəlirinə əlavə etməlidir"],"a":2,"e":"Batmış xərc qərardan asılı deyil; yalnız artımlı pul axınları nəzərə alınır."},{"q":"DIO = 60 gün, DSO = 45 gün, DPO = 30 gündür. Pul dövriyyəsi tsikli neçə gündür?","o":["75","135","45","105"],"a":0,"e":"CCC = 60 + 45 − 30 = 75 gün."},{"q":"İllik tələb 7 200 vahid, bir sifarişin xərci 100 AZN, vahidin illik saxlanma xərci 4 AZN-dir. İqtisadi sifariş həcmi (EOQ) neçədir?","o":["300","849","600","1 200"],"a":2,"e":"EOQ = √(2 × 7 200 × 100 / 4) = √360 000 = 600 vahid."},{"q":"“2/10, net 30” şərtlərində güzəştdən imtinanın təxmini illik dəyəri neçədir?","o":["37,2%","24,5%","2%","73,0%"],"a":0,"e":"(2/98) × (365/20) ≈ 37,2% — bu, adətən bank kreditindən bahadır."},{"q":"Dövriyyə aktivləri 500, inventar 200, qısamüddətli öhdəliklər 250-dir. Tez likvidlik əmsalı neçədir?","o":["1,2","2,0","0,8","2,8"],"a":0,"e":"(500 − 200) / 250 = 1,2. Cari əmsal isə 2,0 olardı."},{"q":"Xalis marja 5%, aktivlərin dövriyyəsi 1,6, kapital multiplikatoru 2,5-dir. DuPont modelinə görə ROE neçədir?","o":["8%","12,5%","4%","20%"],"a":3,"e":"ROE = 5% × 1,6 × 2,5 = 20%."},{"q":"Şirkətin ROE göstəricisi artıb, lakin xalis marja və aktivlərin dövriyyəsi dəyişməyib. Ən ehtimal olunan səbəb nədir?","o":["Vergi dərəcəsinin artması","Satışların artması","İnventarın azalması","Borclanmanın (leverecin) artması"],"a":3,"e":"DuPont modelində dəyişən yeganə komponent kapital multiplikatorudur: borc artıb, bununla risk də artıb."},{"q":"5 000 AZN illik 8% sadə faizlə 3 il yerləşdirilir. Müddətin sonunda məbləğ nə qədər olar?","o":["6 200,00 AZN","6 298,56 AZN","5 400,00 AZN","6 000,00 AZN"],"a":0,"e":"FV = 5 000 × (1 + 0,08 × 3) = 6 20 tışlar 2 000, aktivlər 1 000-dir. Aktivlərin dövriyyəsi neçədir?","o":["1 000","0,5","2,0","20%"],"a":2,"e":"Hər 1 manat aktiv ildə 2 manat satış yaradır."},{"q":"İllik satışlar 3 650, debitor borcları 365-dir. Debitorların dövriyyəsi və yığılma müddəti nə qədərdir?","o":["0,1 dəfə və 365 gün","10 dəfə və 36,5 gün","10 dəfə və 10 gün","3,65 dəfə və 100 gün"],"a":1,"e":"Dövriyyə = 3 650 / 365 = 10; DSO = 365 / 10 = 36,5 gün."},{"q":"Kreditor borcları 100, satışların maya dəyəri 730-dur. Kreditor borclarının ödənmə müddəti (DPO) nə qədərdir?","o":["100 gün","7,3 gün","73 gün","50 gün"],"a":3,"e":"DPO = 100 / (730 / 365) = 100 / 2 = 50 gün."},{"q":"Trend təhlilində satışlar baza ilində 500, sonrakı ildə 600-dür. İndeks (baza = 100) neçədir?","o":["83","100","20","120"],"a":3,"e":"600 / 500 × 100 = 120: satışlar 20% artıb."},{"q":"Şaquli (common-size) təhlildə satışların maya dəyəri satışların 65%-i, rəqiblərdə isə 55%-dir. Bu nəyi göstərir?","o":["Şirkət daha mənfəətlidir","Şirkətin ümumi mənfəət marjası rəqiblərdən aşağıdır","Şirkətin borcu çoxdur","Heç nəyi göstərmir"],"a":1,"e":"Maya dəyərinin payı yüksəkdirsə, ümumi marja (35%) rəqiblərin marjasından (45%) aşağıdır."},{"q":"Aqressiv dövriyyə kapitalı maliyyələşdirmə strategiyasının əsas riski nədir?","o":["Risk yoxdur","Çox yüksək maliyyələşmə xərci","Artıq likvidlik","Daimi ehtiyacların qısamüddətli mənbələrlə maliyyələşdirilməsi səbəbindən yenidən maliyyələşmə və faiz riski"],"a":3,"e":"Qısamüddətli vəsait ucuz ola bilər, lakin hər dövrdə yenilənməlidir; bazar şərtləri pisləşəndə çətinlik yaranır."},{"q":"“Vaxtında təminat” (JIT) sisteminin əsas riski nədir?","o":["İnventar saxlama xərcinin artması","Təchizat zəncirində fasilə yarandıqda istehsalın dayanması","Debitor borclarının artması","Risk yoxdur"],"a":1,"e":"JIT ehtiyat yığımını minimuma endirir, buna görə təchizatçıların etibarlılığından çox asılıdır."},{"q":"Kredit qiymətləndirməsində “5C” modelində “ödəmə qabiliyyəti” (capacity) nəyi ifadə edir?","o":["Girovun dəyərini","Borcalanın dürüstlüyünü","Borcalanın gəlir və pul axınları hesabına borcu ödəmək imkanını","Ümumi iqtisadi şəraiti"],"a":2,"e":"Digər komponentlər: xarakter, kapital, girov və şərait."},{"q":"Şirkət kredit şərtlərini yumşaldır (məsələn, ödəniş müddətini 30 gündən 60 günə uzadır). Ən çox nə gözlənilir?","o":["Heç bir dəyişiklik olmur","Yalnız satışlar azalır","DSO azalır","Satışlar arta bilər, lakin DSO, ümidsiz borclar və dövriyyə kapitalına ehtiyac artır"],"a":3,"e":"Kredit siyasəti satış artımı ilə risk və maliyyələşmə xərci arasında balans tələb edir."},{"q":"Baumol və Miller–Orr modellərinin məqsədi nədir?","o":["Optimal nağd pul qalığını və nağd pulla qiymətli kağızlar arasında köçürmələri müəyyən etmək","Səhmin qiymətini hesablamaq","Kapitalın dəyərini müəyyən etmək","İnventarın sayını hesablamaq"],"a":0,"e":"Hər iki model nağd saxlamanın alternativ xərci ilə əməliyyat xərcləri arasında balans axtarır."},{"q":"Nominal illik faiz 10%, faiz ildə iki dəfə hesablanır. Effektiv illik faiz neçədir?","o":["10,25%","10,00%","20,00%","5,00%"],"a":0,"e":"EAR = (1 + 0,10/2)² − 1 = 1,1025 − 1 = 10,25%."},{"q":"NPV profilində layihənin NPV-si sıfıra bərabər olan diskont dərəcəsi nəyə bərabərdir?","o":["Inflyasiyaya","WACC-a","Risksiz faizə","IRR-ə"],"a":3,"e":"NPV profili diskont dərəcəsi artdıqca NPV-nin azalmasını göstərir; əyrinin üfüqi oxla kəsişməsi IRR-dir."},{"q":"Kapital məhdudiyyəti (capital rationing) şəraitində müstəqil layihələr hansı göstəriciyə görə sıralanmalıdır?","o":["Gəlirlilik indeksinə (PI) — hər manat investisiyaya düşən dəyərə görə","Geri qayıtma müddətinə","Mühasibat mənfəətinə","Layihənin ölçüsünə"],"a":0,"e":"Məhdud büdcə daxilində PI ən çox dəyər yaradan layihə dəstini seçməyə kömək edir."},{"q":"Sadə geri qayıtma müddəti metodunun əsas çatışmazlığı nədir?","o":["Riskləri həddən artıq nəzərə alır","Hesablanması çox çətindir","Yalnız böyük layihələr üçün işləyir","Pulun zaman dəyərini və geri qayıtmadan sonrakı pul axınlarını nəzərə almır"],"a":3,"e":"Buna görə əsas qərar meyarı NPV olmalıdır; geri qayıtma müddəti likvidlik göstəricisi kimi əlavə məlumat verir."},{"q":"Şirkətin bölüşdürülməmiş mənfəətindən istifadənin kapital dəyəri nəyə bərabər götürülür?","o":["Səhmdar kapitalının dəyərinə — çünki səhmdarlar bu vəsaitin alternativ xərcini daşıyır","Sıfıra","Borcun dəyərinə","Risksiz faizə"],"a":0,"e":"Bölüşdürülməmiş mənfəət “pulsuz” deyil: səhmdarlar onu başqa yerə investisiya edə bilərdi."},{"q":"Yeni səhmlərin buraxılışı zamanı yaranan emissiya xərcləri kapital dəyərinə necə təsir edir?","o":["Yalnız borcun dəyərini artırır","Kapitalın dəyərini azaldır","Təsir etmir","Yeni səhmdar kapitalının dəyərini artırır"],"a":3,"e":"Emissiya xərcləri şirkətin əldə etdiyi xalis vəsaiti azaldır, buna görə yeni kapital bölüşdürülməmiş mənfəətdən bahadır."},{"q":"Səhmin betası 1-ə bərabərdir. Bu nə deməkdir?","o":["Səhm risksizdir","Səhmin sistematik riski bazarın riskinə bərabərdir və gözlənilən gəlirliliyi bazarınkına bərabərdir","Səhm bazardan iki dəfə risklidir","Səhm bazarla əlaqəsizdir"],"a":1,"e":"CAPM-ə görə β = 1 olduqda tələb olunan gəlirlilik bazarın gözlənilən gəlirliliyinə bərabərdir."},{"q":"Faiz dərəcəsinin komponentlərinə hansı aid deyil?","o":["İnflyasiya mükafatı","Real risksiz faiz","Valyuta məzənnəsinin səviyyəsi","Defolt riski mükafatı"],"a":2,"e":"Faiz = real risksiz faiz + inflyasiya mükafatı + defolt riski, likvidlik və müddət mükafatları. Məzənnə ayrıca komponent deyil."},{"q":"10 000 AZN illik nominal 12% faizlə, aylıq mürəkkəb hesablama ilə 5 il yerləşdirilir. Gələcək dəyər təxminən nə qədərdir?","o":["16 000 AZN","17 623 AZN","18 167 AZN","16 105 AZN"],"a":2,"e":"FV = 10 000 × 1,01⁶⁰ ≈ 18 167. İllik mürəkkəb hesablamada 17 623, sadə faizlə 16 000 olardı: hesablama tezliyi artdıqca gələcək dəyər artır."},{"q":"Layihə 1-ci il 300, 2-ci il 400, 3-cü il 500 AZN gətirir; diskont dərəcəsi 10%-dir. Pul axınlarının cari dəyəri təxminən nə qədərdir?","o":["979 AZN","1 200 AZN","1 091 AZN","902 AZN"],"a":0,"e":"PV = 300 / 1,1 + 400 / 1,21 + 500 / 1,331 ≈ 272,7 + 330,6 + 375,7 ≈ 979. Qeyri-bərabər axınlar ayrı-ayrılıqda diskontlaşdırılıb toplanır."},{"q":"10 000 AZN kredit 3 il müddətinə 10%-lə, ildə bir bərabər ödənişlə (4 021,15 AZN) verilib. Birinci ödənişin faiz və əsas borc hissələri nə qədərdir?","o":["Faiz 333,33 AZN, əsas borc 3 687,82 AZN","Faiz 4 021,15 AZN, əsas borc 0","Faiz 1 000 AZN, əsas borc 3 021,15 AZN","Faiz 2 000 AZN, əsas borc 2 021,15 AZN"],"a":2,"e":"Faiz = qalıq × faiz dərəcəsi = 10 000 × 10%; qalan hissə əsas borcu azaldır. Sonrakı ödənişlərdə faiz payı azalır, əsas borc payı artır."},{"q":"Diskontlaşdırılmış geri qayıtma müddətini sadə geri qayıtma müddətindən fərqləndirən nədir?","o":["Həmişə daha qısa müddət verir","Geri qayıtmadan sonrakı bütün pul axınlarını nəzərə alır","Pul axınları diskontlaşdırıldığı üçün pulun zaman dəyərini nəzərə alır və daha uzun müddət göstərir","Heç bir fərqi yoxdur"],"a":2,"e":"Hər iki metod geri qayıtmadan sonrakı axınları nəzərə almır, buna görə əsas qərar meyarı NPV olmalıdır."},{"q":"Pul axınlarının işarəsi bir neçə dəfə dəyişən (qeyri-standart) layihədə IRR ilə bağlı hansı problem yarana bilər?","o":["IRR NPV-yə bərabər olur","IRR həmişə sıfıra bərabər olur","Bir neçə IRR və ya ümumiyyətlə IRR olmaması","Heç bir problem yoxdur"],"a":2,"e":"Məsələn, layihənin sonunda böyük ləğvetmə xərci olduqda iki IRR ola bilər; bu halda NPV meyarı etibarlıdır."},{"q":"Oxşar şirkətin borcsuz betası 0,8, hədəf D/E nisbəti 0,5, vergi dərəcəsi 20%-dir. Leverecli beta neçədir?","o":["0,80","1,20","1,12","0,96"],"a":2,"e":"βL = βU × [1 + (1 − t) × D/E] = 0,8 × (1 + 0,8 × 0,5) = 1,12. Bu “pure-play” üsulu birjada olmayan şirkət üçün beta təxmin etməyə imkan verir."},{"q":"Şirkət mənfəətinin 60%-ni reinvestisiya edir, ROE 15%-dir. Dayanıqlı artım tempi neçədir?","o":["25%","6%","15%","9%"],"a":3,"e":"g = b × ROE = 0,6 × 15% = 9%. Bu, şirkətin əlavə kapital cəlb etmədən saxlaya biləcəyi artım tempidir."},{"q":"“İstiqraz gəlirliliyi + risk mükafatı” yanaşmasında səhmdar kapitalının dəyəri necə hesablanır?","o":["Borcun dəyərindən vergi çıxılır","Dividend səhm qiymətinə bölünür","Risksiz faizə beta əlavə edilir","Şirkətin istiqrazlarının gəlirliliyinə adətən 3–5% risk mükafatı əlavə edilir"],"a":3,"e":"Səhmdarlar kreditorlardan daha çox risk daşıdığı üçün şirkətin öz borcundan yüksək gəlirlilik tələb edir; sadə ekspert yanaşmasıdır."},{"q":"Səhmlərin bazar dəyəri 600, borcun bazar dəyəri 400 mln AZN; borcun vergidən əvvəlki dəyəri 8%, vergi 20%, səhmdar kapitalının dəyəri 14%-dir. WACC təxminən neçədir?","o":["12,00%","11,60%","10,40%","10,96%"],"a":3,"e":"WACC = 0,4 × 8% × 0,8 + 0,6 × 14% = 2,56% + 8,4% = 10,96%. Çəkilər bazar dəyərlərindən hesablanır."},{"q":"Şirkətin orta risk səviyyəsindən xeyli riskli yeni layihəsi hansı diskont dərəcəsi ilə qiymətləndirilməlidir?","o":["Layihənin riskini əks etdirən, WACC-dan yüksək dərəcə ilə","Şirkətin WACC-ı ilə","Risksiz faizlə","Borcun dəyəri ilə"],"a":0,"e":"WACC yalnız orta riskli layihələr üçün uyğundur; riskli layihəni WACC ilə diskontlaşdırmaq onun dəyərini şişirdir və pis layihələrin qəbuluna səbəb olur."},{"q":"İllik EBITDA 500, amortizasiya 333,33, vergi 20%-dir. Əməliyyat pul axını nə qədərdir?","o":["400,00","466,67","133,33","500,00"],"a":1,"e":"(500 − 333,33) × (1 − 0,2) + 333,33 = 133,33 + 333,33 = 466,67. Amortizasiya pul xərci olmadığı üçün geri əlavə edilir."},{"q":"Amortizasiya 333,33, vergi dərəcəsi 20%-dir. Amortizasiyanın vergi qalxanı nə qədərdir?","o":["333,33","66,67","266,67","0"],"a":1,"e":"Vergi qalxanı = amortizasiya × vergi dərəcəsi: amortizasiya vergi tutulan mənfəəti azaldaraq vergi ödənişini 66,67 azaldır."},{"q":"Layihə üçün dövriyyə kapitalına edilən investisiya pul axınlarında necə əks olunur?","o":["Layihənin əvvəlində pul çıxışı, sonunda isə geri qaytarılan pul daxilolması kimi","Nəzərə alınmır","Yalnız sonda xərc kimi","Diskont dərəcəsinə əlavə edilir"],"a":0,"e":"İnventar və debitorlara qoyulan vəsait layihə bitdikdə azad olunur; zaman fərqinə görə dövriyyə kapitalı NPV-ni azaldır."},{"q":"Kapital büdcələmə prosesində post-auditin məqsədi nədir?","o":["Faktiki nəticələri proqnozla müqayisə edib proqnozlaşdırmanı və qərarvermə prosesini təkmilləşdirmək","Layihəni ləğv etmək","Vergini hesablamaq","Layihəni yenidən maliyyələşdirmək"],"a":0,"e":"Post-audit həm də həddən artıq optimist proqnozların qarşısını alır və hesabatlılığı gücləndirir."},{"q":"Əməliyyat tsikli necə hesablanır?","o":["DSO − DPO","DIO + DSO − DPO","DIO + DSO","DPO − DIO"],"a":2,"e":"Əməliyyat tsikli xammalın alınmasından satışdan pulun yığılmasına qədərdir; DPO çıxıldıqda pul dövriyyəsi tsikli alınır."},{"q":"DIO = 60, DSO = 45, DPO = 40 gündür. Pul dövriyyəsi tsikli neçə gündür?","o":["145","65","105","25"],"a":1,"e":"CCC = 60 + 45 − 40 = 65 gün: şirkətin öz vəsaiti bu qədər müddət dövriyyədə qalır."},{"q":"Dövriyyə kapitalının maliyyələşdirilməsində uyğunlaşdırma (matching) prinsipi nəyi tələb edir?","o":["Bütün aktivlərin qısamüddətli kreditlə maliyyələşdirilməsini","Daimi aktivlərin uzunmüddətli, müvəqqəti dövriyyə ehtiyaclarının isə qısamüddətli mənbələrlə maliyyələşdirilməsini","Bütün aktivlərin yalnız səhmdar kapitalı ilə maliyyələşdirilməsini","Maliyyələşmə mənbəyinin əhəmiyyətsiz olmasını"],"a":1,"e":"Aktivlərin və öhdəliklərin müddətlərinin uyğunlaşdırılması yenidən maliyyələşmə riskini azaldır."},{"q":"Dövriyyə kapitalına mühafizəkar investisiya siyasətinin əsas çatışmazlığı nədir?","o":["Çatışmazlığı yoxdur","Likvidlik riski çox yüksək olur","Satışlar mütləq dayanır","Likvidlik yüksək olsa da, artıq nağd və inventar gəlirliliyi aşağı salır"],"a":3,"e":"Mühafizəkar siyasət təhlükəsizlik, aqressiv siyasət isə gəlirlilik tərəfə əyilir."},{"q":"İllik nağd ehtiyacı 1 200 000 AZN, bir köçürmənin xərci 50 AZN, faiz 5%-dir. Baumol modelinə görə optimal köçürmə məbləği təxminən nə qədərdir?","o":["4 899 AZN","24 495 AZN","120 000 AZN","48 990 AZN"],"a":3,"e":"C* = √(2 × 1 200 000 × 50 / 0,05) ≈ 48 990: köçürmə xərci ilə nağd saxlamanın alternativ xərcini balanslaşdırır."},{"q":"Miller–Orr modelində nağd axınların dəyişkənliyi artarsa, yuxarı və aşağı hədlər arasındakı məsafə necə dəyişər?","o":["Dəyişməz","Azalar","Artar","Sıfıra enər"],"a":2,"e":"Daha dəyişkən axınlarda tez-tez köçürmə etməmək üçün daha geniş interval lazımdır; faiz artdıqca isə interval daralır."},{"q":"İqtisadi sifariş həcmində (EOQ) illik sifariş xərcləri ilə saxlama xərcləri arasında hansı münasibət olur?","o":["Bərabər olurlar","Sifariş xərcləri həmişə iki dəfə çoxdur","Saxlama xərcləri sıfırdır","Aralarında əlaqə yoxdur"],"a":0,"e":"Məsələn, D = 7 200, S = 100, H = 4 olduqda EOQ = 600; sifariş xərcləri 12 × 100 = 1 200, saxlama xərcləri 300 × 4 = 1 200."},{"q":"Gündəlik istifadə 20 vahid, çatdırılma müddəti 5 gün, təhlükəsizlik ehtiyatı 50 vahiddir. Yenidən sifariş nöqtəsi neçədir?","o":["100","150","50","125"],"a":1,"e":"20 × 5 + 50 = 150: anbarda 150 vahid qaldıqda yeni sifariş verilməlidir."},{"q":"İnventarın ABC təhlilində “A” qrupuna hansı mallar aiddir?","o":["Sayca çox, dəyəri aşağı mallar","Sayca az, lakin ümumi dəyərin böyük hissəsini təşkil edən, sıx nəzarət tələb edən mallar","Yalnız köhnəlmiş mallar","Yalnız idxal malları"],"a":1,"e":"Nəzarət resursları dəyəri yüksək olan mövqelərə yönəldilir; C qrupu üçün sadə nəzarət kifayətdir."},{"q":"Debitor borclarının yaşlandırma cədvəlində 90 gündən çox gecikmiş payın 1%-dən 3%-ə qalxması nəyin siqnalıdır?","o":["Heç nəyin","Satışların sağlam artımı","İnventarın azalması","Kredit standartlarının zəifləməsi və ya müştərilərin maliyyə vəziyyətinin pisləşməsi"],"a":3,"e":"Yaşlandırma cədvəli debitorların keyfiyyətini izləmək və kredit siyasətinə vaxtında düzəliş etmək üçün istifadə olunur."},{"q":"Kredit xəttinin limiti 1 mln AZN, istifadə olunan hissə 600 000 AZN, faiz 10%, istifadə olunmayan hissəyə öhdəlik haqqı 0,5%-dir. İstifadə olunan vəsaitin effektiv dəyəri təxminən neçədir?","o":["10,50%","10,00%","10,33%",
