ərə malik olmalıdır?","o":["Yalnız rəhbər şəxslər üçün açıq olmalıdır","Yalnız şifahi olmalıdır","Məlumat verənin adını bütün əməkdaşlara açıqlamalıdır","Təhlükəsiz və əlçatan olmalı, məlumat verənin anonimliyini və məxfiliyini qorumalı, vicdanlı niyyətlə məlumat verəni təzyiqdən müdafiə etməlidir"],"a":3,"e":"Kodeks, 9.1. Məlumatlandırma kanalları fırıldaqçılığın erkən aşkarlanması üçün əsas əməliyyat riski alətidir."},{"q":"Mərkəzi Bankın Etik Kodeksinə görə əməliyyat və məlumat təhlükəsizliyi üçün nə tələb olunur?","o":["Yalnız şifahi xəbərdarlıq","Yalnız fiziki mühafizə","Hər cür xidmət mühitində zəruri olan bütün texniki və hüquqi tədbirlər, həmçinin müştərilərin qoruyucu tədbirlər barədə məlumatlandırılması","Heç bir tədbir"],"a":2,"e":"Kodeks, 8.4. Bu tələb kiber riskin idarə edilməsinin davranış tərəfini əhatə edir."},{"q":"Azərbaycanda çirkli pulların yuyulmasına qarşı mübarizə çərçivəsində maliyyə qurumları şübhəli əməliyyatlar barədə məlumatı hansı quruma təqdim edir?","o":["Xarici auditora","Dövlət Statistika Komitəsinə","Bankların Assosiasiyasına","Maliyyə Monitorinqi Xidmətinə"],"a":3,"e":"Maliyyə Monitorinqi Xidməti ölkənin maliyyə kəşfiyyatı bölməsidir; Etik Kodeks də bu sahədə qanunvericiliyə uyğunluğun gücləndirilməsini məqsəd kimi göstərir (Kodeks, 1)."},{"q":"BCBS-in “Əməliyyat riskinin sağlam idarə edilməsi prinsipləri”nə görə əməliyyat riski çərçivəsini kim təsdiq edir və nəzarət edir?","o":["Hər əməkdaş ayrıca","Yalnız İT şöbəsi","Yalnız xarici auditor","Şura (idarəetmə orqanı); icra orqanı onu həyata keçirir"],"a":3,"e":"Prinsiplər güclü risk mədəniyyəti, üç müdafiə xətti və Şuranın nəzarət rolunu vurğulayır."},{"q":"Əməliyyat riskinin idarə edilməsi prinsiplərinə görə yeni məhsul və ya sistem tətbiq edilməzdən əvvəl nə edilməlidir?","o":["Yalnız reklam kampaniyası hazırlanmalıdır","Heç nə — risklər sonradan aşkar ediləcək","Dəyişikliyin əməliyyat riskləri qiymətləndirilməli və təsdiq prosesindən keçməlidir (dəyişikliklərin idarəsi)","Yalnız satış planı təsdiqlənməlidir"],"a":2,"e":"Bir çox böyük insident (məs., Knight Capital) nəzarətsiz dəyişikliklərdən yaranıb."},{"q":"BCBS-in “Əməliyyat dayanıqlılığı prinsipləri”nin (2021) əsas ideyası nədir?","o":["Kritik əməliyyatları müəyyən etmək, onların asılılıqlarını xəritələndirmək və fasiləyə tolerantlıq çərçivəsində xidməti davam etdirmək","Bütün riskləri tamamilə aradan qaldırmaq","Yalnız sığorta almaq","Yalnız kapitalı artırmaq"],"a":0,"e":"Dayanıqlılıq insidentlərin baş verəcəyini qəbul edir və kritik xidmətlərin bərpa qabiliyyətinə fokuslanır."},{"q":"Əməliyyat dayanıqlılığını ənənəvi biznes davamlılığı planlaşdırmasından nə fərqləndirir?","o":["Dayanıqlılıq bütün təşkilat səviyyəsində kritik xidmətlərin fasiləyə tolerantlığına fokuslanır, BCP isə ayrı-ayrı proseslərin bərpa planlarıdır","Aralarında fərq yoxdur","BCP daha genişdir və dayanıqlılığı əhatə edir","Dayanıqlılıq yalnız İT-yə aiddir"],"a":0,"e":"BCP dayanıqlılığın alətlərindən biridir; dayanıqlılıq üçüncü tərəfləri, insidentləri və asılılıqları da əhatə edir."},{"q":"Standartlaşdırılmış ölçmə yanaşmasında (SMA) daxili zərər multiplikatoru (ILM) 1-dən böyükdürsə, bu nə deməkdir?","o":["Bankın itkisi yoxdur","Kapital tələbi azalır","Bankın tarixi itkiləri biznes göstəricisi komponentinə nisbətən yüksəkdir və kapital tələbi artır","Yanaşma tətbiq edilmir"],"a":2,"e":"ILM bankın öz zərər tarixçəsini kapitala əks etdirir: itkiləri çox olan bank daha çox kapital saxlayır."},{"q":"Bazel III yekun paketində qabaqcıl ölçmə yanaşmasının (AMA) ləğv edilməsinin əsas səbəbi nədir?","o":["Əməliyyat riskinin aradan qalxması","AMA çox sadə idi","Daxili modellərin mürəkkəbliyi və banklar arasında nəticələrin müqayisə oluna bilməməsi","Bankların sayının azalması"],"a":2,"e":"SMA sadə, müqayisə oluna bilən və risk həssaslığını zərər tarixçəsi ilə saxlayan yanaşmadır."},{"q":"SMA-da daxili zərər məlumatları üçün tələb olunan tarixçə adətən nə qədərdir?","o":["1 ay","10 il (keçid dövründə ən azı 5 il)","1 il","50 il"],"a":1,"e":"Uzun tarixçə nadir, lakin ağır hadisələri əks etdirmək üçün vacibdir; zərərlərin toplanması üçün minimum hədd adətən 20 000 avrodur."},{"q":"DDoS hücumu nədir?","o":["Sistemi çoxsaylı sorğularla həddən artıq yükləyərək xidmətin əlçatanlığını pozmaq","Məlumatların şifrələnib fidyə tələb edilməsi","İşçinin şifrəsinin aldadıcı e-poçtla ələ keçirilməsi","Kartın fiziki oğurlanması"],"a":0,"e":"DDoS əsasən əlçatanlığa hücumdur; qarşı tədbirlər trafikin süzülməsi və ehtiyat tutumdur."},{"q":"Əməkdaş rəhbərin adından “təcili” ödəniş tələb edən e-poçt alır və ödəniş rekvizitləri dəyişib. Ən düzgün addım hansıdır?","o":["E-poçtdakı nömrəyə zəng edib təsdiqləmək","Təcili olduğu üçün dərhal ödəmək","Tələbi əvvəlcədən məlum olan rəsmi kanal (məs., telefon) ilə müstəqil təsdiqləmək","Ödənişi həmkarına ötürmək"],"a":2,"e":"Bu, biznes e-poçtunun kompromisi (sosial mühəndislik) əlamətidir; e-poçtdakı əlaqə məlumatı da saxta ola bilər."},{"q":"Kiber insidentə cavabın düzgün ardıcıllığı hansıdır?","o":["Aradan qaldırma → aşkarlama → məhdudlaşdırma","Bərpa → aşkarlama → məhdudlaşdırma","Dərslərin çıxarılması → aşkarlama → bərpa","Aşkarlama → məhdudlaşdırma → aradan qaldırma → bərpa → dərslərin çıxarılması"],"a":3,"e":"Əvvəlcə zərərin yayılması dayandırılır, sonra səbəb aradan qaldırılır və xidmət bərpa olunur."},{"q":"Ehtiyat nüsxələr üçün “3-2-1” qaydası nəyi tələb edir?","o":["3 server, 2 şəbəkə, 1 şifrə","3 il, 2 ay, 1 gün saxlama","3 nüsxə, 2 müxtəlif daşıyıcı, 1 nüsxə kənar və ya oflayn yerdə","3 əməkdaş, 2 rəhbər, 1 auditor"],"a":2,"e":"Oflayn nüsxə ransomware hücumunda məlumatların bərpasını təmin edir."},{"q":"ISO/IEC 27001 standartı nəyi tənzimləyir?","o":["Maliyyə hesabatlarını","İnformasiya təhlükəsizliyinin idarəetmə sistemini","Kapital adekvatlığını","Ətraf mühitin idarə edilməsini"],"a":1,"e":"Standart risk əsaslı nəzarət tədbirləri seçimi və davamlı təkmilləşdirmə tələb edir."},{"q":"Üçüncü tərəf təchizatçı ilə müqavilə bağlamazdan əvvəl ən vacib addım hansıdır?","o":["Yalnız reklam materiallarına baxmaq","Yalnız ən ucuz təklifi seçmək","Müqaviləni yoxlamadan imzalamaq","Xidmətin kritikliyini qiymətləndirmək və təchizatçı üzrə due diligence aparmaq"],"a":3,"e":"Kritik xidmətlər üçün maliyyə sabitliyi, təhlükəsizlik, davamlılıq və subpodratçılar yoxlanılır."},{"q":"Autsorsinq müqaviləsində çıxış strategiyasının məqsədi nədir?","o":["Təchizatçını cəzalandırmaq","Təchizatçı uğursuz olduqda və ya müqavilə bitdikdə xidməti fasiləsiz başqa təchizatçıya və ya daxilə köçürmək","Müqaviləni gizli saxlamaq","Xərcləri artırmaq"],"a":1,"e":"Çıxış planı olmadan bank təchizatçıdan asılı vəziyyətə düşür."},{"q":"Hansı əlamət daxili fırıldaqçılıq üçün “qırmızı bayraq” sayılır?","o":["Əməkdaşın məzuniyyətə çıxmaqdan imtina etməsi və gəlirinə uyğun olmayan həyat tərzi","Əməkdaşın təlimlərdə iştirakı","Əməkdaşın vaxtında işə gəlməsi","Əməkdaşın sənədləri düzgün doldurması"],"a":0,"e":"Gizlədilən sxemlər çox vaxt əməkdaşın davamlı iştirakını tələb edir; məcburi məzuniyyət onları üzə çıxara bilər."},{"q":"ACFE-nin “Report to the Nations” hesabatlarına görə peşə fırıldaqçılığının ən çox aşkarlandığı üsul hansıdır?","o":["Məlumat (tip) — çox vaxt əməkdaşlardan gələn məlumat","Xarici audit","Təsadüf","Polis araşdırması"],"a":0,"e":"Bu, effektiv məlumatlandırma (whistleblowing) kanallarının əhəmiyyətini göstərir; Etik Kodeks də belə kanalların yaradılmasını tələb edir (Kodeks, 9.1)."},{"q":"Müştərinin hesabat həddindən aşağı qalmaq üçün nağd əməliyyatları qəsdən kiçik hissələrə bölməsi necə adlanır?","o":["Diversifikasiya","Strukturlaşdırma (smurfing)","Hedcinq","Sekyuritizasiya"],"a":1,"e":"Bu, çirkli pulların yuyulmasının tipik əlamətidir və şübhəli əməliyyat kimi bildirilməlidir."},{"q":"Şübhəli əməliyyat barədə məlumat verildikdən sonra əməkdaş müştəriyə bunu demək istəyir. Bu necə qiymətləndirilir?","o":["Müştəri hüququdur, mütləq deyilməlidir","Qadağandır — müştərinin xəbərdar edilməsi (tipping-off) araşdırmanı poza bilər","Yalnız müştəri soruşarsa deyilməlidir","Yalnız yazılı formada deyilə bilər"],"a":1,"e":"Xəbərdarlıq qadağası beynəlxalq standartların (FATF) və milli qanunvericiliyin əsas tələbidir."},{"q":"Model riski idarəetməsində model reyestrinin (inventarının) məqsədi nədir?","o":["Modelləri gizli saxlamaq","Bütün modelləri, onların sahiblərini, istifadəsini, risk səviyyəsini və validasiya tarixlərini mərkəzləşdirilmiş qaydada izləmək","Yalnız proqram lisenziyalarını saymaq","Modellərin sayını azaltmaq"],"a":1,"e":"Reyestr olmadan hansı modellərin validasiyadan keçmədiyini bilmək mümkün deyil."},{"q":"Biznes təsirinin təhlilində MTPD (maksimum dözülə bilən fasilə müddəti) ilə RTO arasında hansı münasibət olmalıdır?","o":["Aralarında əlaqə yoxdur","RTO MTPD-dən uzun olmalıdır","Onlar həmişə bərabərdir","RTO MTPD-dən qısa olmalıdır"],"a":3,"e":"RTO prosesin bərpası üçün hədəfdir; bu hədəf dözülə bilən maksimum müddətdən əvvəl yerinə yetirilməlidir."},{"q":"Əməliyyat riski ssenari təhlilində ekspertlər adətən nəyi qiymətləndirir?","o":["Ağır, lakin mümkün hadisələrin tezliyini (məs., 25 ildə bir) və şiddətini","Yalnız keçən ayın itkilərini","Yalnız bazar qiymətlərini","Yalnız gəlirləri"],"a":0,"e":"Ssenarilər daxili zərər məlumatlarında olmayan nadir hadisələri əhatə edir."},{"q":"Əməliyyat riski üzrə stress testin xüsusiyyəti nədir?","o":["Stress test əməliyyat riskinə tətbiq edilmir","Yalnız normal gün itkilərini hesablamaq","Yalnız valyuta məzənnəsini dəyişmək","Kiber hücum, böyük fırıldaqçılıq və sistem dayanması kimi ağır ssenariləri makroiqtisadi şəraitlə birlikdə qiymətləndirib kapital planlaşdırmasında istifadə etmək"],"a":3,"e":"Böhran dövrlərində fırıldaqçılıq və hüquqi itkilər tez-tez artır; buna görə ssenarilər birləşdirilir."},{"q":"Bazel tərifinə görə əməliyyat riskinin mənbələrinə hansı aid deyil?","o":["Xarici hadisələr","İnsanlar","Proseslər və sistemlər","Bazar faizlərinin dəyişməsi"],"a":3,"e":"Əməliyyat riski daxili proseslərin, insanların, sistemlərin uğursuzluğundan və xarici hadisələrdən yaranır; faiz dəyişikliyi bazar riskidir."},{"q":"Bankın müştəri ilə müqavilə mübahisəsində məhkəmə qərarı ilə ödədiyi təzminat hansı riskə aiddir?","o":["Likvidlik riskinə","Strateji riskə","Bazar riskinə","Əməliyyat riskinə (hüquqi risk)"],"a":3,"e":"Bazel tərifinə görə hüquqi risk əməliyyat riskinin tərkib hissəsidir."},{"q":"Saxta sənədlərlə verilmiş kreditin defoltundan yaranan itki Bazel qaydalarına görə kapital hesablamasında necə nəzərə alınır?","o":["Yalnız əməliyyat riskinə daxil edilir","Kredit riskində qalır, lakin əməliyyat riski məlumat bazasında da qeyd edilir (sərhəd hadisəsi)","Heç yerdə nəzərə alınmır","Bazar riskinə aid edilir"],"a":1,"e":"Sərhəd hadisələri ikiqat kapital hesablanmasının qarşısını alır, lakin fırıldaqçılıq nəzarətlərinin təhlili üçün qeydə alınır."},{"q":"Bazel standartlaşdırılmış yanaşmasında neçə biznes xətti fərqləndirilir?","o":["7","8","5","12"],"a":1,"e":"8 biznes xətti və 7 hadisə növü var — imtahanda bu iki rəqəm tez-tez qarışdırılır."},{"q":"Standartlaşdırılmış yanaşmada (TSA) pərakəndə bankçılıq üçün β əmsalı neçədir?","o":["15%","12%","18%","10%"],"a":1,"e":"Pərakəndə bankçılıq, aktivlərin idarə edilməsi və pərakəndə brokerlik — 12%; kommersiya bankçılığı və agent xidmətləri — 15%; korporativ maliyyə, ticarət və satış, ödəniş və hesablaşmalar — 18%."},{"q":"Standartlaşdırılmış yanaşmada (TSA) korporativ maliyyə və ödəniş-hesablaşmalar üçün β əmsalı neçədir?","o":["15%","12%","18%","20%"],"a":2,"e":"Daha riskli sayılan biznes xətlərinə daha yüksək β tətbiq edilir."},{"q":"Nəzarətin “dizayn effektivliyi” ilə “icra effektivliyi” arasındakı fərq nədir?","o":["Aralarında fərq yoxdur","Dizayn effektivliyi nəzarətin düzgün qurulub-qurulmadığını, icra effektivliyi isə praktikada ardıcıl tətbiq olunub-olunmadığını göstərir","Dizayn effektivliyi yalnız İT nəzarətlərinə aiddir","İcra effektivliyi yalnız auditdə yoxlanılır"],"a":1,"e":"Yaxşı qurulmuş nəzarət tətbiq edilmirsə faydasızdır; RCSA-da hər ikisi qiymətləndirilir."},{"q":"Kiber hücumdan sonra məlumatların ehtiyat nüsxədən bərpası hansı növ nəzarətdir?","o":["Qabaqlayıcı","Düzəldici","Aşkarlayıcı","Kompensasiyaedici"],"a":1,"e":"Qabaqlayıcı nəzarət hadisənin qarşısını alır, aşkarlayıcı onu tapır, düzəldici isə nəticələri aradan qaldırır və bərpa edir."},{"q":"Avtomatik nəzarətlər əl ilə aparılan nəzarətlərdən nə ilə fərqlənir?","o":["Adətən daha etibarlıdır və insan səhvinə daha az məruz qalır, lakin onların düzgün konfiqurasiyası yoxlanılmalıdır","Heç vaxt yoxlanmağa ehtiyac duymur","Həmişə daha az effektivdir","Yalnız kiçik banklarda istifadə olunur"],"a":0,"e":"Səhv konfiqurasiya edilmiş avtomatik nəzarət səhvi kütləvi şəkildə təkrarlaya bilər; buna görə dəyişikliklərin idarəsi vacibdir."},{"q":"Yaxşı əsas risk göstəricisinin (KRİ) xüsusiyyətinə hansı aid deyil?","o":["Proqnozlaşdırıcı olması","Ölçülə bilən olması","Yalnız keçmiş itkiləri göstərməsi və hədlərinin olmaması","Mütəmadi hesablanması və hədlərinin olması"],"a":2,"e":"KRİ erkən xəbərdarlıq üçündür: proqnozlaşdırıcı, müqayisə oluna bilən və hədləri (yaşıl, kəhrəba, qırmızı) olan göstərici olmalıdır."},{"q":"“Az qala baş vermiş” hadisələr (near miss) zərər məlumat bazasında niyə qeydə alınmalıdır?","o":["Onlar yalnız audit üçündür","Onlar kapital hesablamasına birbaşa daxil edilir","Onları qeyd etmək qadağandır","Onlar itki yaratmasa da, nəzarət zəifliyini göstərir və gələcək itkilərin qarşısını almağa kömək edir"],"a":3,"e":"İsveçrə pendiri modelinə görə near miss bir neçə müdafiə qatının zəif olduğunu, lakin sonuncu qatın işlədiyini göstərir."},{"q":"Bazel standartlaşdırılmış ölçmə yanaşmasında daxili zərər məlumatlarının toplanması üçün minimum hədd adətən nə qədərdir?","o":["20 000 avro; nəzarətçi daha böyük banklar üçün onu 100 000 avroya qaldıra bilər","1 avro","1 mln avro","Hədd yoxdur"],"a":0,"e":"Hədd kiçik itkilərin toplanma xərcini azaldır, lakin məlumatın kapital hesablaması üçün tamlığını qoruyur."},{"q":"Ssenari seminarlarında lövbər və qrup təfəkkürü qərəzlərini azaltmaq üçün hansı üsul istifadə olunur?","o":["Rəhbərin ilk deyilən rəqəmi təsdiqləməsi","Ekspertlərin anonim, çoxmərhələli qiymətləndirməsi (Delfi üsulu) və müstəqil fasilitator","Yalnız bir ekspertdən istifadə","Ssenarilərin nəzərə alınmaması"],"a":1,"e":"Anonimlik və müstəqil etiraz iştirakçıların bir-birinin və rəhbərin fikrinə uyğunlaşmasının qarşısını alır."},{"q":"Zərər paylanması yanaşmasında (LDA) tezlik və şiddət adətən hansı paylanmalarla modelləşdirilir?","o":["Tezlik — normal, şiddət — bərabər paylanma","Tezlik — Poisson, şiddət — lognormal və ya digər qalın quyruqlu paylanma","Hər ikisi — binomial","Hər ikisi — normal"],"a":1,"e":"İki paylanma Monte Karlo simulyasiyası ilə birləşdirilərək illik ümumi itki paylanması alınır."},{"q":"Simulyasiya edilmiş illik əməliyyat itkisi paylanmasının 99,9%-lik kvantili 12 mln, gözlənilən illik itki 1 mln AZN-dir. Gözlənilməz itki nə qədərdir?","o":["13 mln AZN","12 mln AZN","11 mln AZN","1 mln AZN"],"a":2,"e":"Gözlənilməz itki = kvantil − gözlənilən itki = 12 − 1. Quyruq gözlənilən itkidən dəfələrlə böyükdür — əməliyyat riskinin tipik xüsusiyyəti."},{"q":"Sistemin dayanması ya ehtimalı 0,5% olan server uğursuzluğundan, ya da ehtimalı 2% olan şəbəkə nasazlığından yarana bilər (müstəqil hadisələr). Dayanma ehtimalı təxminən neçədir?","o":["0,5%","0,01%","2,0%","2,5%"],"a":3,"e":"VƏ YA qapısı: 1 − (1 − 0,005) × (1 − 0,02) ≈ 2,49%. Ən zəif nöqtə — tək şəbəkə kanalı — riski müəyyən edir."},{"q":"FMEA təhlilində nasazlığın şiddəti 9, baş vermə ehtimalı 3, aşkarlanma çətinliyi 4 qiymətləndirilir. Risk prioriteti nömrəsi (RPN) neçədir?","o":["108","16","36","27"],"a":0,"e":"RPN = S × O × D = 9 × 3 × 4 = 108. Avtomatik yoxlama aşkarlanmanı 1-ə endirsə, RPN 27-yə enər."},{"q":"FAIR modelində təhdid hadisələrinin tezliyi ildə 10, həssaslıq 20%, bir hadisənin orta zərəri 150 000 AZN-dir. İllik itki gözləntisi nə qədərdir?","o":["30 000 AZN","1 500 000 AZN","300 000 AZN","150 000 AZN"],"a":2,"e":"LEF = 10 × 20% = 2 hadisə/il; illik itki = 2 × 150 000 = 300 000 AZN. Çoxfaktorlu autentifikasiya həssaslığı 5%-ə endirsə, gözlənti 75 000 AZN olar."},{"q":"İsveçrə pendiri modelində “gizli şərait” (latent conditions) nəyi ifadə edir?","o":["Operatorun anlıq səhvi","Uzun müddət görünməyən sistem zəiflikləri — zəif dizayn, resurs çatışmazlığı, səhv prosedurlar","Bankın gizli mənfəəti","Müştərinin şəxsi məlumatları"],"a":1,"e":"Operatorun səhvi (aktiv uğursuzluq) çox vaxt yalnız tetikdir; insidentin kök səbəbi gizli şəraitdə olur."},{"q":"NIST Kibertəhlükəsizlik Çərçivəsinin 2.0 versiyasında (2024) əlavə edilmiş funksiya hansıdır?","o":["Qoruma (Protect)","Bərpa (Recover)","Aşkarlama (Detect)","İdarəetmə (Govern)"],"a":3,"e":"Altı funksiya: idarəetmə, müəyyənləşdirmə, qoruma, aşkarlama, cavab vermə, bərpa. İdarəetmə kiber riskin strategiya və risk iştahası ilə əlaqəsini vurğulayır."},{"q":"İnformasiya təhlükəsizliyi rəhbərinin (CISO) effektivliyi üçün hansı şərt vacibdir?","o":["Bonusunun yalnız İT layihələrinin sürətinə bağlanması","Satış bölməsinə tabe olması","Müstəqil statusu və Şuraya (və ya onun komitəsinə) hesabat vermək imkanı","Heç bir səlahiyyətinin olmaması"],"a":2,"e":"Kiber risk Şura səviyyəsində idarə olunmalıdır; CISO-nun müstəqilliyi riskin gizlədilməsinin qarşısını alır."},{"q":"Kiber davamlılıq yanaşmasının əsas fərziyyəsi nədir?","o":["Kiber risk sığorta ilə tam aradan qalxır","Bütün hücumların qarşısını tamamilə almaq mümkündür","Hücum mütləq olacaq — məqsəd kritik xidmətləri fasiləyə tolerantlıq çərçivəsində davam etdirmək və tez bərpa etməkdir","Kiber risk yalnız İT şöbəsinin məsələsidir"],"a":2,"e":"Göstəricilər: aşkarlamaya, məhdudlaşdırmaya və bərpaya qədər orta vaxt."},{"q":"Bulud provayderi ilə SLA aylıq 99,9% əlçatanlıq tələb edir. Bu, ayda təxminən nə qədər fasiləyə icazə verir?","o":["Təxminən 43 dəqiqə","Təxminən 7 saat","0 dəqiqə","Təxminən 3 gün"],"a":0,"e":"30 gün × 24 saat × 60 dəqiqə × 0,1% ≈ 43 dəqiqə. Daha uzun fasilə SLA pozuntusudur və müqavilə sanksiyalarına səbəb olur."},{"q":"Autsorsinqdə “stress şəraitində çıxış” planı hansı halı əhatə edir?","o":["Təchizatçının qiymətlərini artırmasını","Müqavilənin planlı bitməsini","Təchizatçının iflası və ya ciddi pozuntusu səbəbindən xidmətin təcili köçürülməsini","Yeni təchizatçının seçilməsini"],"a":2,"e":"Planlı çıxışdan fərqli olaraq stress şəraitində vaxt azdır; alternativ təchizatçılar və məlumatların ötürülməsi əvvəlcədən hazırlanmalıdır."},{"q":"Fırıldaqçılıq “almazı” modeli fırıldaqçılıq üçbucağına hansı elementi əlavə edir?","o":["Sığorta","Bacarıq (capability)","Kapital","Likvidlik"],"a":1,"e":"Üçbucaq: təzyiq, imkan, əsaslandırma. Almaz modeli fırıldaqçılığı həyata keçirmək üçün şəxsi bacarıq və vəziyyəti də nəzərə alır."},{"q":"Müştərini tanıma (CDD) prosesinə hansı aid deyil?","o":["Müştərinin siyasi baxışlarının qiymətləndirilməsi","Müştərinin və benefisiar mülkiyyətçinin eyniləşdirilməsi və yoxlanılması","İşgüzar münasibətin məqsədinin anlaşılması","Davamlı monitorinq"],"a":0,"e":"CDD-nin məqsədi cinayət gəlirlərinin yuyulması riskini qiymətləndirməkdir; siyasi baxışlar meyar deyil (siyasi xadim statusu isə ayrıca — gücləndirilmiş yoxlama üçün nəzərə alınır)."},{"q":"FATF tövsiyələrinə görə əməliyyat və müştəri eyniləşdirmə sənədləri ən azı neçə il saxlanılmalıdır?","o":["6 ay","1 il","5 il","50 il"],"a":2,"e":"Saxlanma tələbi araşdırmalar zamanı əməliyyatların izlənməsinə imkan verir; milli qanunvericilik də müvafiq müddətlər müəyyən edir."},{"q":"Sanksiya skrininqinin məqsədi nədir?","o":["Valyuta məzənnəsini müəyyən etmək","Müştərilərin kredit reytinqini hesablamaq","Müştərilərin və əməliyyatların sanksiya siyahılarındakı şəxs və təşkilatlarla əlaqəsini aşkarlamaq","Əməkdaşların performansını qiymətləndirmək"],"a":2,"e":"Sanksiya pozuntuları ciddi cərimələrə və müxbir bank münasibətlərinin itirilməsinə səbəb ola bilər."},{"q":"RTO-nun çox qısa (məsələn, 15 dəqiqə) olması tələb olunan kritik sistem üçün hansı ehtiyat sahə növü uyğ lir."},{"q":"Təchizat zəncirində əmək hüquqlarının pozulması ESİ-nin hansı sütununa aid riskdir?","o":["Ekoloji (E)","Sosial (S)","İdarəetmə (G)","Heç birinə"],"a":1,"e":"Belə pozuntular reputasiya, hüquqi və kommersiya riskləri yaradır."},{"q":"Şuranın tərkibində müxtəlifliyin (bilik, təcrübə, gender) olması ESİ-nin hansı sütununa aiddir?","o":["Ekoloji (E)","İdarəetmə (G)","Sosial (S)","Heç birinə"],"a":1,"e":"Müxtəlif tərkib qərarvermədə “qrup təfəkkürü” riskini azaldır."},{"q":"Şirkətin keçid planının etibarlılığını qiymətləndirərkən nəyə baxılır?","o":["Yalnız reklam şüarlarına","Ölçülə bilən aralıq hədəflərə, kapital xərclərinin hədəflərlə uyğunluğuna və idarəetmə məsuliyyətinə","Yalnız uzaq gələcəkdəki hədəflərə","Yalnız səhmin qiymətinə"],"a":1,"e":"Aralıq hədəflər və investisiya planı olmadan uzaq “net zero” vədi yaşıl yuyulma riski daşıyır."},{"q":"Aİ-də “yaşıl aktivlər əmsalı” (GAR) nəyi göstərir?","o":["Bankın aktivlərinin Aİ taksonomiyasına uyğun ekoloji dayanıqlı fəaliyyətləri maliyyələşdirən payını","Bankın kapital adekvatlığını","Bankın likvidliyini","Bankın işçilərinin sayını"],"a":0,"e":"GAR bank balansının yaşıl keçidə uyğunluğunu ölçən açıqlama göstəricisidir."},{"q":"SASB-ın əhəmiyyətlilik xəritəsinin əsas ideyası nədir?","o":["Yalnız ekoloji mövzular əhəmiyyətlidir","Bütün sahələr üçün eyni mövzular əhəmiyyətlidir","Hər sahə üçün maliyyə baxımından əhəmiyyətli olan davamlılıq mövzuları fərqlidir","Əhəmiyyətlilik anlayışı yoxdur"],"a":2,"e":"Məsələn, neft sektoru üçün emissiyalar, bank sektoru üçün məlumat təhlükəsizliyi və məsuliyyətli kreditləşmə daha əhəmiyyətlidir."},{"q":"Aİ-nin CSRD və ESRS standartları hansı əhəmiyyətlilik yanaşmasını tətbiq edir?","o":["İkiqat əhəmiyyətlilik — həm maliyyə əhəmiyyətliliyi, həm də təsir əhəmiyyətliliyi","Yalnız maliyyə əhəmiyyətliliyi","Yalnız gəlirlilik","Heç bir əhəmiyyətlilik yanaşması"],"a":0,"e":"ISSB investor yönümlü maliyyə əhəmiyyətliliyinə, Aİ isə ikiqat əhəmiyyətliliyə əsaslanır."},{"q":"Təsir investisiyasında “əlavəlilik” (additionality) anlayışı nəyi ifadə edir?","o":["Portfelə əlavə səhm daxil edilməsini","Əlavə komissiya alınmasını","İnvestisiya olmadan baş verməyəcək müsbət sosial və ya ekoloji nəticənin yaradılmasını","Gəlirin iki dəfə artmasını"],"a":2,"e":"Əlavəlilik təsirin həqiqiliyinin əsas meyarıdır."},{"q":"İqlimlə bağlı fiziki risklərin girov portfelinə təsirini qiymətləndirmək üçün hansı məlumat xüsusilə vacibdir?","o":["Valyuta məzənnəsi","Borcalanların yaşı","Bankın reklam büdcəsi","Girov obyektlərinin coğrafi yerləşməsi (geolokasiya) və təhlükə xəritələri"],"a":3,"e":"Daşqın və ya yanğın zonasındakı əmlakın dəyəri və sığortalanma imkanı aşağı düşə bilər."},{"q":"“Batmış aktivlər” kredit riskinə necə təsir edir?","o":["Yalnız likvidliyi artırır","Kredit riskini azaldır","Kredit riskinə təsir etmir","Borcalanın gəlirini və girovun dəyərini azaldaraq defolt ehtimalını və defolt halında itkini artırır"],"a":3,"e":"Keçid riski bu kanal vasitəsilə bankın kredit portfelinə ötürülür."},{"q":"Yaşıl istiqraz çərçivəsinə uyğunluğun yoxlanılmasında müstəqil xarici rəyin (ikinci tərəf rəyi) faydası nədir?","o":["Heç bir faydası yoxdur","Kredit reytinqini avtomatik yüksəldir","Kuponu sıfıra endirir","İnvestorlara iddiaların etibarlılığı barədə təminat verir və yaşıl yuyulma riskini azaldır"],"a":3,"e":"ICMA prinsipləri xarici yoxlamanı tövsiyə edir."},{"q":"Norma əsaslı skrininq nədir?","o":["Yalnız yaşıl istiqrazlara investisiya","Bütün sahələrdən ən böyük şirkətlərin seçilməsi","Beynəlxalq normalara (məsələn, BMT Qlobal Sazişi) ciddi zidd fəaliyyət göstərən şirkətlərin portfeldən istisna edilməsi","Səsvermədə iştirakdan imtina"],"a":2,"e":"Neqativ skrininq bütöv sahələri, norma əsaslı skrininq isə konkret pozuntuları olan şirkətləri istisna edir."},{"q":"“Universal sahiblər” anlayışı nəyi ifadə edir və onlar üçün hansı risklər xüsusilə əhəmiyyətlidir?","o":["Yalnız bir şirkətə sahib investorlar; şirkətə xas risklər","Bütün bazara sahib böyük investorlar; diversifikasiya ilə aradan qaldırılmayan sistemik ESİ riskləri","Dövlət orqanları; vergi riski","Kiçik pərakəndə investorlar; likvidlik riski"],"a":1,"e":"İqlim dəyişikliyi və bərabərsizlik kimi risklər bütün portfelə təsir edir, buna görə universal sahiblər aktiv sahibliyə daha çox maraq göstərir."},{"q":"Aşağıdakılardan hansı uzunmüddətli tələbi və riskləri yenidən formalaşdıran meqatrenddir?","o":["Səhmin bir günlük qiyməti","Bir şirkətin rüblük mənfəəti","Valyutanın gündəlik dəyişməsi","Əhalinin yaşlanması və rəqəmsallaşma"],"a":3,"e":"Meqatrendlər (demoqrafiya, urbanizasiya, texnologiya, resurs qıtlığı) investisiya imkanlarını və sahə risklərini uzunmüddətli dəyişir."},{"q":"Sement şirkəti ildə 200 000 ton CO₂ emissiya edir, EBITDA-sı 40 mln dollar, borcu 120 mln dollardır. Ton başına 50 dollar karbon vergisi tətbiq edilərsə, borc/EBITDA nisbəti necə dəyişər?","o":["3,0-dan 2,0-a enər","3,0-dan 4,0-a yüksələr","Dəyişməz","3,0-dan 6,0-a yüksələr"],"a":1,"e":"Əlavə xərc 200 000 × 50 = 10 mln; EBITDA 30 mln-a düşür, 120 / 30 = 4,0. Keçid riski beləcə borcalanın PD-sinə və kovenantlara ötürülür."},{"q":"Karbon vergisini emissiya ticarəti sistemindən (cap-and-trade) fərqləndirən əsas xüsusiyyət nədir?","o":["Vergidə karbonun qiyməti sabit, emissiya həcmi qeyri-müəyyəndir; ticarət sistemində isə ümumi həcm sabit, qiymət bazarda formalaşır","Aralarında fərq yoxdur","Vergi emissiyaları qadağan edir","Ticarət sistemində karbonun qiyməti dövlət tərəfindən sabitlənir"],"a":0,"e":"Hər iki mexanizm kənar təsiri daxililəşdirərək karbona qiymət verir."},{"q":"Uzunmüddətli quraqlığın kənd təsərrüfatı borcalanlarının gəlirinə təsiri hansı iqlim riskinə aiddir?","o":["Xroniki fiziki risk","Kəskin fiziki risk","Siyasət keçid riski","Texnologiya keçid riski"],"a":0,"e":"Tədricən baş verən uzunmüddətli dəyişikliklər xroniki, ani ekstremal hadisələr (daşqın, yanğın) isə kəskin fiziki riskdir."},{"q":"Su qıtlığı şirkətin maliyyə nəticələrinə necə təsir edə bilər?","o":["Təchizat zəncirini pozaraq, xərcləri artıraraq və bəzi fəaliyyətləri qeyri-mümkün edərək","Heç bir təsiri yoxdur","Yalnız reklam xərclərini artırır","Həmişə gəliri artırır"],"a":0,"e":"Ekoloji məhdudiyyətlər maliyyə dəyərinə birbaşa təsir edir, xüsusilə suya intensiv sahələrdə (kənd təsərrüfatı, enerji, içki istehsalı)."},{"q":"Biomüxtəlifliyin itirilməsi niyə sistemik ESİ riski sayılır?","o":["Maliyyə sektoruna heç təsir etmir","Yalnız bir şirkətə təsir edir","Ekosistem xidmətlərinin (tozlanma, su təmizlənməsi) itməsi bütün iqtisadiyyata təsir edir və diversifikasiya ilə aradan qaldırılmır","Yalnız turizm sahəsinə aiddir"],"a":2,"e":"Sistemik risklər bütün portfelə təsir edir; buna görə investorlar və mərkəzi banklar təbiətlə bağlı riskləri də qiymətləndirməyə başlayıb."},{"q":"“İçəridən kənara” (inside-out) əhəmiyyətlilik nəyi ifadə edir?","o":["Yalnız səhm qiymətini","ESİ amillərinin şirkətin maliyyə nəticələrinə təsirini","Şirkətin daxili auditini","Şirkətin ətraf mühitə və cəmiyyətə təsirini"],"a":3,"e":"“Kənardan içəriyə” baxış maliyyə əhəmiyyətliliyidir (ISSB); hər ikisinin birlikdə nəzərə alınması ikiqat əhəmiyyətlilikdir (Aİ)."},{"q":"Korporativ sosial məsuliyyətin (KSM) xüsusiyyəti nədir?","o":["Məcburi maliyyə hesabatlılığı","Yalnız vergi ödəmək","Şirkətin qanunun tələbindən kənar könüllü sosial və ekoloji öhdəlikləri","Səhmdarlara dividend ödəmək"],"a":2,"e":"KSM korporativ dayanıqlılığın bir hissəsidir; müasir yanaşmada o, strategiyaya inteqrasiya olunmalıdır."},{"q":"“Üçqat nəticə” konsepsiyasını kim irəli sürüb və o nəyi ölçür?","o":["H. Markowitz; portfelin riskini","J. Elkington; şirkətin sosial (insanlar), ekoloji (planet) və iqtisadi (mənfəət) nəticələrini","W. Sharpe; riskə uyğunlaşdırılmış gəliri","J. Keynes; məcmu tələbi"],"a":1,"e":"Üçqat nəticə şirkət uğurunu yalnız mənfəətlə ölçməyin məhdudluğunu göstərir."},{"q":"Bank ümumi dəyəri (EVIC) 100 mln dollar olan şirkətə 10 mln dollar kredit verib; şirkətin illik emissiyası 50 000 ton CO₂-dir. PCAF metodologiyasına görə bankın maliyyələşdirilmiş emissiyası nə qədərdir?","o":["50 000 ton","5 000 ton","500 ton","10 000 ton"],"a":1,"e":"Atribusiya əmsalı = 10 / 100 = 10%; maliyyələşdirilmiş emissiya = 10% × 50 000 = 5 000 ton CO₂."},{"q":"Portfel 60% A şirkətindən (gəlir milyonuna 100 ton CO₂) və 40% B şirkətindən (gəlir milyonuna 400 ton) ibarətdir. Çəkili orta karbon intensivliyi (WACI) neçədir?","o":["500 ton / mln gəlir","250 ton / mln gəlir","220 ton / mln gəlir","160 ton / mln gəlir"],"a":2,"e":"WACI = 0,6 × 100 + 0,4 × 400 = 60 + 160 = 220."},{"q":"200 mln dollarlıq dayanıqlılığa bağlı istiqrazda emitent KPI hədəfinə çatmasa, kupon 25 baza bəndi artır. İllik əlavə xərc nə qədər olar?","o":["0,05 mln dollar","5 mln dollar","25 mln dollar","0,5 mln dollar"],"a":3,"e":"200 mln × 0,25% = 0,5 mln dollar: maliyyə stimulu emitenti hədəfə çatmağa təşviq edir."},{"q":"Şirkətin daimi illik pul axını 10 mln dollar, diskont dərəcəsi 10%-dir. Zəif idarəetmə səbəbindən 1 faiz bəndi əlavə risk mükafatı tətbiq edilərsə, dəyər təxminən necə dəyişər?","o":["100 mln-dan təxminən 90,9 mln dollara (təxminən 9% azalma)","Dəyişməz","100 mln-dan 110 mln dollara artar","100 mln-dan 50 mln dollara enər"],"a":0,"e":"10 / 0,10 = 100; 10 / 0,11 ≈ 90,9: ESİ riskinin diskont dərəcəsi vasitəsilə qiymətləndirməyə inteqrasiyasının nümunəsi."},{"q":"ICMA Yaşıl İstiqraz Prinsiplərinin dörd əsas komponentinə hansı aid deyil?","o":["Layihələrin qiymətləndirilməsi və seçimi","Vəsaitin istifadəsi","Kuponun ESİ reytinqinə bağlanması","Vəsaitin idarə edilməsi və hesabatlılıq"],"a":2,"e":"Kuponun hədəflərə bağlanması dayanıqlılığa bağlı istiqrazların xüsusiyyətidir; yaşıl istiqraz vəsaitin istifadəsinə əsaslanır."},{"q":"Dayanıqlılıq istiqrazı nədir?","o":["Yalnız səhmlərə çevrilən istiqraz","Yalnız dövlətin buraxdığı istiqraz","Kuponu olmayan istiqraz","Vəsaiti həm yaşıl, həm də sosial layihələrin birgə maliyyələşdirilməsinə yönələn istiqraz"],"a":3,"e":"Dayanıqlılıq istiqrazı həm Yaşıl, həm də Sosial İstiqraz Prinsiplərinə uyğun olmalıdır."},{"q":"Yüksək keyfiyyətli karbon kreditinin əsas meyarlarına hansı aid deyil?","o":["Kreditin bir neçə dəfə satıla bilməsi","Əlavəlilik — azalma kredit olmadan baş verməzdi","Davamlılıq — azalma uzunmüddətli olmalıdır","Təkrar sayılmama"],"a":0,"e":"Eyni azalmanın bir neçə dəfə sayılması iqlim iddialarını yanıldıcı edir və yaşıl yuyulma riski yaradır."},{"q":"Analitik ESİ reytinqlərindən necə istifadə etməlidir?","o":["Bütün agentliklərin reytinqlərinin eyni olduğunu fərz etməlidir","Yalnız ən yüksək reytinqə baxmalıdır","Reytinqləri tamamilə nəzərə almamalıdır","Reytinqin hansı amilləri, hansı çəkilərlə və necə ölçdüyünü anlamalı, ona mexaniki etibar etməməlidir"],"a":3,"e":"Müxtəlif agentliklərin reytinqləri zəif korrelyasiyalıdır, çünki metodologiyaları fərqlidir."},{"q":"NGFS-in “nizamlı keçid” ssenarisinin xüsusiyyəti hansıdır?","o":["Siyasət gecikir və kəskin tətbiq edilir","İqlim siyasəti erkən və tədricən tətbiq olunur; keçid riski orta, fiziki risk aşağıdır","Siyasət tətbiq edilmir, fiziki risklər ən yüksəkdir","Heç bir risk yoxdur"],"a":1,"e":"Nizamsız keçiddə keçid riski, “isti ev dünyası”nda isə fiziki risk ən yüksəkdir."},{"q":"Bankda iqlim ssenari təhlilinin nəticələri necə istifadə edilməlidir?","o":["Risk iştahasında, kapital planlaşdırmasında və kredit siyasətində (məsələn, sektor limitlərində)","Yalnız illik hesabatın reklam bölməsində","Heç yerdə — yalnız arxivdə saxlanılır","Yalnız əməkdaşların bonuslarını hesablamaq üçün"],"a":0,"e":"BCBS-in iqlim riskləri prinsipləri iqlim risklərinin kapital və likvidlik qiymətləndirməsinə və risk idarəetməsinə inteqrasiyasını tələb edir."},{"q":"ISSB standartları ilə Aİ-nin CSRD və ESRS tələbləri arasındakı əsas konseptual fərq nədir?","o":["Aİ yalnız maliyyə əhəmiyyətliliyini tələb edir","ISSB yalnız sosial amilləri əhatə edir","ISSB investor yönümlü maliyyə əhəmiyyətliliyinə, Aİ isə ikiqat əhəmiyyətliliyə əsaslanır","Aralarında fərq yoxdur"],"a":2,"e":"Aİ şirkətdən həm ESİ amillərinin ona təsirini, həm də onun cəmiyyətə və ətraf mühitə təsirini açıqlamağı tələb edir."},{"q":"Aİ taksonomiyasının ekoloji məqsədlərinə hansı aid deyil?","o":["Çirklənmənin qarşısının alınması","İqlim dəyişikliyinə uyğunlaşma","Səhmdarların gəlirinin maksimumlaşdırılması","Su və dəniz resurslarının dayanıqlı istifadəsi və qorunması"],"a":2,"e":"Altı məqsəd: iqlim dəyişikliyinin yumşaldılması, ona uyğunlaşma, su, sirkulyar iqtisadiyyat, çirklənmənin qarşısının alınması, biomüxtəliflik və ekosistemlər."},{"q":"BCBS-in iqlimlə bağlı maliyyə riskləri üzrə 18 prinsipindən neçəsi nəzarətçilər üçündür?","o":["3","12","18","6"],"a":3,"e":"12 prinsip banklar (idarəetmə, daxili nəzarət, kapital və likvidlik, risk idarəetməsi, monitorinq, ssenari təhlili), 6 prinsip isə nəzarət orqanları üçündür."},{"q":"Bankın “yaşıl” kredit məhsulunun ekoloji faydalarını sübutsuz şişirtməsi Mərkəzi Bankın Etik Kodeksinin hansı tələblərinə ziddir?","o":["Dürüstlük prinsipinə və məlumatların açıqlanmasında şəffaflığa","Yalnız əməliyyatların prioritetliliyinə","Yalnız vəzifədən sui-istifadəyə","Heç bir tələbə"],"a":0,"e":"Aldatma ilə məqsədə çatmaq dürüstlüyə ziddir (Kodeks, 4.1.1); qərarverməyə təsir edən məlumat dəqiq təqdim edilməlidir (Kodeks, 6.2)."},{"q":"ESİ riskləri ilə ənənəvi risk növləri arasında əlaqə necə şərh olunur?","o":["ESİ riskləri ayrıca risk növü deyil, kredit, bazar, əməliyyat, likvidlik və reputasiya risklərinin yeni səbəbidir","ESİ riskləri digər risklərlə əlaqəsizdir","ESİ riskləri yalnız reputasiya riskidir","ESİ riskləri yalnız gələcəkdə yaranacaq"],"a":0,"e":"Buna görə ESİ riskləri mövcud risk idarəetmə çərçivəsinə — taksonomiyaya, limitlərə, stress testlərə — inteqrasiya edilir."},{"q":"Sosial istiqraz ilə yaşıl istiqraz arasındakı fərq nədir?","o":["Yaşıl istiqraz yalnız dövlətlər tərəfindən buraxılır","Sosial istiqrazın kuponu yoxdur","Sosial istiqrazın vəsaiti müsbət sosial nəticəli layihələrə (əlçatan mənzil, səhiyyə, təhsil), yaşıl istiqrazınkı isə ekoloji layihələrə yönəlir","Aralarında fərq yoxdur"],"a":2,"e":"Hər ikisi “vəsaitin istifadəsi” prinsipinə əsaslanır, fərq maliyyələşdirilən layihələrin növündədir."},{"q":"Sədr və baş icraçı direktor rollarının ayrılmasının idarəetmə baxımından əsas faydası nədir?","o":["Heç bir faydası yoxdur","Şirkətin xərclərini azaldır","Səhmdarların səs hüququnu ləğv edir","Şuranın icra rəhbərliyinə müstəqil nəzarətini gücləndirir və səlahiyyətin bir şəxsdə cəmləşməsinin qarşısını alır"],"a":3,"e":"İdarəetmə (G) amillərinin zəifliyi digər ESİ risklərinin gizlədilməsinə və gec aşkarlanmasına səbəb ola bilər."},{"q":"Mərkəzi Bankın Etik Kodeksinə görə maliyyə sektorunda sosial (S) amillərə aid peşəkar öhdəlik hansıdır?","o":["Müştəri məlumatlarını reklam üçün paylaşmaq","Yalnız mənfəəti artırmaq","Cəmiyyətin maliyyə savadlılığının artırılmasına töhfə vermək və maliyyə inklüzivliyini dəstəkləmək","Həssas müştərilərə yüksək komissiyalı məhsul satmaq"],"a":2,"e":"Kodeks, 10 və 10.2: sosial məsuliyyət maliyyə inklüzivliyini və maarifləndirməni əhatə edir; həssas qruplardan sui-istifadə isə qadağandır (10.1)."},{"q":"Təsir investisiyasında nəticələrin ölçülməsi niyə vacibdir?","o":["Ölçmə yalnız vergi hesablanması üçündür","Ölçülə bilən sosial və ya ekoloji nəticə təsir investisiyasının əsas meyarıdır; ölçmə olmadan təsir iddiası yoxlanıla bilməz","Təsir investisiyasında heç bir göstərici ölçülmür","Ölçmə yalnız səhm qiyməti üçün tələb olunur"],"a":1,"e":"Təsir investisiyası maliyyə gəliri ilə yanaşı ölçülə bilən nəticə və əlavəlilik tələb edir; ölçülməyən təsir iddiası yaşıl yuyulma riski daşıyır."}]}],"clauses":{"1":"Məqsəd — peşəkarların davranış standartlarının vahid qaydada formalaşdırılması üçün tövsiyələr; yüksək peşəkarlıq, şəffaflıq, məsuliyyət və etimad mühiti, ictimai inamın gücləndirilməsi; korrupsiyaya, cinayət yolu ilə əldə edilmiş vəsaitlərin leqallaşdırılmasına və terrorçuluğun maliyyələşdirilməsinə qarşı mübarizə, istehlakçı hüquqlarının müdafiəsi üzrə tələblərə uyğunluğun gücləndirilməsi.","2":"Əhatə dairəsi — Mərkəzi Bankın bütün nəzarət subyektləri, onların əməkdaşları, idarəetmə orqanlarının və onların komitələrinin üzvləri; gündəlik fəaliyyətə və strateji qərarvermə proseslərinə tətbiq üçün tövsiyə xarakteri daşıyır.","3":"Əsas anlayışlar — davamlı inkişaf, etik davranış, etik prinsiplər, ictimai etibar, maliyyə məhsulu, maliyyə savadlılığı, maraqlar münaqişəsi, nəzarət subyekti, peşəkar, tövsiyə haqları.","3.1.1":"Davamlı inkişaf — bilik, bacarıq və səriştələrin mütəmadi yenilənməsi, yeni trendlərlə ayaqlaşma və dəyişən mühitə uyğunlaşmaq üçün öyrənməyə davam etmək.","3.1.2":"Etik davranış — peşəkar fəaliyyətin dürüstlük, obyektivlik, məsuliyyətlilik, şəffaflıq, məxfilik, ədalət, bərabərlik, səriştəlilik və ictimai etibarın qorunması prinsiplərinə uyğun həyata keçirilməsi.","3.1.3":"Etik prinsiplər — Kodeksin 4-cü hissəsində nəzərdə tutulmuş, peşəkar davranışı müəyyən edən prinsiplər.","3.1.4":"İctimai etibar — maliyyə sektoruna və orada çalışan mütəxəssislərə cəmiyyətin göstərdiyi inam və etimad.","3.1.5":"Maliyyə məhsulu — nəzarət subyektinin fiziki və hüquqi şəxslərə təklif etdiyi məhsul və xidmətlər.","3.1.6":"Maliyyə savadlılığı — maliyyə məhsullarını başa düşmək, risk və imkanları qiymətləndirmək, məlumatlı qərar vermək üçün zəruri məlumatlılıq, bilik, bacarıq və davranışlar toplusu.","3.1.7":"Maraqlar münaqişəsi — peşəkarın şəxsi və ya kommersiya maraqlarının vəzifələrini obyektiv və ədalətli icra etməsinə mane olduğu vəziyyət.","3.1.8":"Nəzarət subyekti — banklar, bank olmayan kredit təşkilatları, sığorta bazarının peşəkar iştirakçıları, investisiya şirkətləri və qiymətli kağızlar bazarının digər lisenziyalı iştirakçıları, investisiya fondları və onların idarəçiləri, ödəniş və elektron pul təşkilatları, ödəniş sistemləri operatorları, kredit büroları və Mərkəzi Bankın nəzarət etdiyi digər şəxslər.","3.1.9":"Peşəkar — fiziki şəxs kimi nəzarət subyekti olanlar, nəzarət subyektində əmək və ya mülki-hüquqi müqavilə üzrə çalışanlar, o cümlədən idarəetmə orqanlarının və onların komitələrinin üzvləri.","3.1.10":"Tövsiyə haqları — müştəriyə məhsul və ya xidmət tövsiyə etmək müqabilində üçüncü şəxslərdən alınan və ya onlara ödənilən hər hansı kompensasiya, haqq və ya fayda.","4":"Etik prinsiplər — dürüstlük, obyektivlik, məsuliyyətlilik, şəffaflıq, məxfilik, ədalət və bərabərlik, səriştəlilik, ictimai etibarın qorunması.","4.1.1":"Dürüstlük — aldatma, manipulyasiya və qeyri-etik vasitələrlə məqsədə çatmaqdan çəkinmək.","4.1.2":"Obyektivlik — qərarların qərəzsiz, emosional və şəxsi maraqlardan asılı olmadan verilməsi.","4.1.3":"Məsuliyyətlilik — hərəkət və qərarlara görə məsuliyyət daşımaq, nəticələri qəbul etməyə hazır olmaq.","4.1.4":"Şəffaflıq — məlumat və qərarları aydın, dəqiq və vaxtında açıqlamaq.","4.1.5":"Məxfilik — bank, sığorta, kommersiya sirri və qanunla qorunan digər konfidensial məlumatları qorumaq; yalnız qanunda nəzərdə tutulan hallarda başqalarına vermək.","4.1.6":"Ədalət və bərabərlik — bütün maraqlı tərəflərə ədalətli davranmaq, ayrı-seçkiliyə və qərəzə yol verməmək.","4.1.7":"Səriştəlilik — yüksək səriştə nümayiş etdirmək və bacarıqları təkmilləşdirməyə səy göstərmək.","4.1.8":"İctimai etibarın qorunması — sektora ictimai inamı gücləndirən davranış, onu zədələyə biləcək hərəkətlərdən çəkinmək.","5":"Peşəkarlıq — peşəkar davranışın təməli: texniki səriştə ilə yanaşı qanunlara və dəyərlərə sadiqlik, inkişaf motivasiyası və ictimai inamı qorumaq məsuliyyəti.","5.1":"Səriştəlilik və davamlı inkişaf — zəruri bilik, bacarıq və təcrübəyə malik olmaq, onları mütəmadi yeniləmək və digər peşəkarların səriştəsinin inkişafına töhfə verməyə səy göstərmək.","5.2":"Qanunvericiliyə və etik normalara riayət — qanunvericilik, normativ aktlar və tənzimləyici tələblərlə tam tanış olmaq və riayət etmək; hüquqi öhdəliklərdən yayınma, hüquqi boşluqlardan sui-istifadə və hüquqi çərçivədən yan keçmə cəhdlərindən çəkinmək.","6":"Maliyyə bazarlarında dürüstlük — informasiya asimmetriyasından sui-istifadə etməmək, şəffaflıq və obyektivliyə riayət etmək, manipulyasiyadan və qeyri-qanuni hallardan çəkinmək.","6.1":"Daxili və mühüm məlumatlar — məxfi və açıqlanmamış məlumata əsaslanaraq hərəkət etməmək və başqalarını təşviq etməmək; məlumatı qorumaq və şəxsi maraq üçün istifadə etməmək.","6.2":"Açıqlamada şəffaflıq — əhəmiyyətli məlumatlar aidiyyəti tərəflərə vaxtında və dəqiq təqdim edilir; məlumatın maraqlara uyğun olmaması açıqlanmanın qarşısını almır; qəsdən gizlətmə və təhrif yolverilməzdir.","6.3":"Bazarda sui-istifadəyə yol verilməməsi — qiymətləri süni dəyişdirmək, ticarət həcmini təhrif etmək, aktivlərin dəyərini yanlış təqdim etmək və iştirakçıları aldatmaq məqsədli birbaşa və dolayı davranışlardan çəkinmək və onları təşviq etməmək.","7":"Maraqlar münaqişəsi — potensial münaqişələr əvvəlcədən müəyyən edilir, yazılı və ya elektron formada birbaşa rəhbərə bildirilir, daxili prosedurlara uyğun qeydiyyata alınır; peşəkar həmin məsələ üzrə qərarvermə və müzakirədə iştirak etmir.","7.1":"Münaqişənin qarşısının alınması — müştəriyə və ya işəgötürənə aydın, sadə dildə və diqqətçəkən şəkildə tam açıqlama; şəxsi maraq müştəri marağından üstün tutulmur.","7.2":"Əməliyyatların prioritetliliyi — bütün müştərilərə bərabər davranış; şəxsi mənfəət üçün prioritet dəyişdirilmir; ailə üzvlərinin və tanışların hesabları imtiyazsız idarə edilir.","7.3":"Hədiyyələr və tövsiyə haqları — tövsiyəyə görə alınan və ya verilən fayda barədə əlaqəli tərəflər əvvəlcədən məlumatlandırılır; müstəqilliyə təsir edən və ya müəyyən edilmiş limitləri aşan hədiyyə, güzəşt və kompensasiya alınmır və tələb edilmir.","8":"Müştərilərlə münasibətlər — qarşılıqlı etimad, şəffaflıq və ehtiyaclara uyğun xidmət; şəxsi münasibətlər peşəkar münasibətlərə təsir etmir.","8.1":"Uyğun məhsullar — işgüzar münasibətdən əvvəl müştərinin maliyyə təcrübəsi, risk və gəlir gözləntiləri, maliyyə məhdudiyyətləri nəzərə alınır; məhsul yalnız uyğun olduqda tövsiyə edilir.","8.2":"Müştərilərlə ünsiyyət — məhsulun mahiyyəti, xüsusiyyətləri və xərcləri izah olunur; faktlar fikirlərdən ayrılır; müştərilərlə borc alma-vermə və zamin durma kimi əlaqələrdən çəkinilir.","8.3":"Müştərilərə qarşı davranış — irq, etnik mənsubiyyət, din, dil, cins, sağlamlıq vəziyyəti, mənşə, əmlak vəziyyəti, qulluq mövqeyi, əqidə və ictimai birliklərə mənsubiyyətdən asılı olmayaraq ayrı-seçkiliyə yol verilmir.","8.4":"Müştəri məlumatlarının mühafizəsi — bank, sığorta və kommersiya sirri yalnız qanunvericiliklə müəyyən edilmiş hallarda açıqlanır; texniki və hüquqi təhlükəsizlik tədbirləri görülür; müştərilər qoruyucu tədbirlər barədə məlumatlandırılır.","9":"İşəgötürənə qarşı öhdəliklər — nüfuzu qorumaq, resurslardan düzgün istifadə etmək, etik pozuntular barədə müvafiq strukturları məlumatlandırmaq; rəhbərlər nümunə olur.","9.1":"Qayda pozuntuları barədə məlumatlandırma — məlum olan və ya əsaslı şübhə doğuran faktlar yazılı və ya müəyyən edilmiş vasitələrlə operativ bildirilir; məlumat məxfi qeydiyyata alınır; anonimlik, məxfilik və vicdanlı niyyətlə məlumat verənlərin təzyiqdən qorunması təmin edilir.","9.2":"Vəzifədən sui-istifadə — işəgötürən fərqli qayda nəzərdə tutmadıqda resurslardan yalnız xidmət məqsədləri üçün istifadə; vəzifə səlahiyyətləri şəxsi mənfəət üçün istifadə edilmir.","9.3":"Reputasiya və ictimai açıqlamalar — nəzarət subyekti barədə açıqlama yalnız rəhbərliyin açıq icazəsi ilə; iş saatında və ondan kənar, o cümlədən sosial mediada nüfuz qorunur.","9.4":"Etik iş davranışı və peşəkar ünsiyyət — nəzakətli, hörmətli, inklüziv davranış; fikir ayrılığı konstruktiv və qarşılıqlı hörmət çərçivəsində ifadə edilir.","9.5":"Rəhbər şəxslərin məsuliyyəti — əlavə prosedur ehtiyacını müəyyən etmək; inkişaf, mentorluq və təlim imkanları yaratmaq; Kodeksə riayətə dəstək göstərmək, şərait yaratmaq və nəzarət etmək.","10":"Sosial məsuliyyət — ətraf mühitin qorunmasına, sosial ədalətin təşviqinə və maliyyə inklüzivliyinin genişlənməsinə töhfə.","10.1":"Sosial və ətraf mühitə qarşı məsuliyyət — dayanıqlı maliyyə təcrübələrini dəstəkləmək; həssas qruplardan sui-istifadəyə və bərabərsizliyi artıran fəaliyyətlərə qatılmamaq.","10.2":"Cəmiyyətə töhfə və maliyyə maarifləndirməsi — maliyyə savadlılığının artırılmasına dəstək, məlumatın əlçatan və aydın paylaşılması.","11":"Təşkilati etik kodekslərin uyğunlaşdırılması — daxili kodekslər Kodeksə uyğunlaşdırılır, bütün peşəkarlar üçün əlçatan edilir, yenilənmələr barədə məlumat verilir.","12":"Dəstək və şərait — təlim, hüquqi və texniki dəstək, resurslar və əlverişli iş mühiti; etik davranışa şərait korporativ mədəniyyətin hissəsidir; mütəmadi təlimlər.","13":"Nəzarət və icra — ədalətli, şəffaf və sənədləşdirilmiş mexanizmlər; uyğunluq göstəriciləri əsas risk göstəricilərində; risklərin idarə edilməsinə kuratorluq edən şəxsin nəzarəti; rəhbər heyətin mükafatlandırılmasında etik göstəricilər; əmək qanunvericiliyinə uyğun intizam tədbirləri."}};
  const MODS = DATA.modules;
  const byId = {};
  MODS.forEach((m) => { byId[m.id] = m; });
  const TOTAL = MODS.reduce((s, m) => s + m.qs.length, 0);
  const REQ = MODS.filter((m) => m.req).map((m) => m.id);
  const ALL = MODS.map((m) => m.id);
  const SEC = 90, TARGET = 70, LETTERS = 'ABCDE';
  const KEY = 'cbar-rm-sim-v1';
  const app = document.getElementById('app');

  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
  if (!store.best) store.best = {};
  const settings = Object.assign({ count: '20', order: 'random', variant: {} }, store.settings || {});
  if (!settings.variant || typeof settings.variant !== 'object') settings.variant = {};
  const VARS = MODS.reduce((s, m) => s + m.v.length, 0);
  const save = () => { try { store.settings = settings; localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* storage unavailable */ } };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const mmss = (s) => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };
  const qOf = (it) => byId[it.mid].qs[it.qi];
  const CL = DATA.clauses || {};
  const refsOf = (txt) => {
    const out = [];
    const add = (g) => g.replace(/–/g, ',').split(/\s*(?:,|və)\s*/).forEach((r) => { r = r.trim(); if (/^\d{1,2}(\.\d{1,2}){0,2}$/.test(r) && out.indexOf(r) < 0) out.push(r); });
    String(txt).replace(/Kodeks(?:in)?\s*[,(]?\s*(\d{1,2}(?:\.\d{1,2}){0,2}(?:\s*(?:,|və|–)\s*\d{1,2}(?:\.\d{1,2}){0,2})*)/g, (m0, g) => { add(g); return m0; });
    String(txt).replace(/\((\d{1,2}(?:\.\d{1,2}){0,2}(?:\s*(?:,|və)\s*\d{1,2}(?:\.\d{1,2}){0,2})*)\)/g, (m0, g) => { add(g); return m0; });
    return out;
  };
  const clauseOf = (r) => { let k = r; while (k) { if (CL[k]) return [k, CL[k]]; k = k.indexOf('.') > 0 ? k.slice(0, k.lastIndexOf('.')) : ''; } return null; };
  const explain = (q, a, mid) => {
    let h = '<p class="ex-ans"><strong>Düzgün cavab: ' + LETTERS[q.a] + ')</strong> ' + fmt(q.o[q.a]) + '</p>';
    if (a !== null && a !== q.a) h += '<p class="ex-ans"><strong>Sizin cavabınız: ' + LETTERS[a] + ')</strong> ' + fmt(q.o[a]) + '</p>';
    h += '<p class="ex-text"><strong>İzah:</strong> ' + fmt(q.e) + '</p>';
    if (mid === 'E1' || mid === 'E2') {
      const seen = {}, items = [];
      refsOf(q.e).forEach((r) => { const c = clauseOf(r); if (c && !seen[c[0]]) { seen[c[0]] = 1; items.push('<p><strong>' + esc(c[0]) + '.</strong> ' + fmt(c[1]) + '</p>'); } });
      if (items.length) h += '<div class="ex-src"><span class="h">Kodeksin müvafiq müddəaları</span>' + items.slice(0, 3).join('') + '</div>';
    }
    return h;
  };

  const table = (q) => q.t ? '<div class="tbl"><table><thead><tr>' + q.t.head.map((h) => '<th>' + fmt(h) + '</th>').join('') + '</tr></thead><tbody>' + q.t.rows.map((r) => '<tr>' + r.map((c) => '<td>' + fmt(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' : '';
  const setTitle = (ids, label) => ids.length === 1 ? byId[ids[0]].code + ' ' + byId[ids[0]].title : (label === 'req' ? 'Məcburi modullar üzrə qarışıq imtahan' : 'Bütün modullar üzrə qarışıq imtahan');
  const selOf = (m) => { const v = settings.variant[m.id]; if (v === 'r') return 'r'; return Number.isInteger(v) && v >= 0 && v < m.v.length ? v : 0; };
  const keyOf = (m) => { const v = selOf(m); return v === 'r' ? m.id : m.id + '-v' + (v + 1); };
  const subOf = (m) => { const v = selOf(m); return v === 'r' ? ', təsadüfi test' : ', variant ' + (v + 1); };

  let S = null;

  function home() {
    if (S && S.timer) clearInterval(S.timer);
    S = null;
    const seg = (act, list, cur) => list.map(([v, l]) => '<button type="button" data-act="' + act + '" data-v="' + v + '" aria-pressed="' + (cur === v) + '">' + l + '</button>').join('');
    const row = (m) => {
      const sel = selOf(m);
      const b = store.best[keyOf(m)] || {};
      const parts = [];
      if (b.practice != null) parts.push('məşq ' + b.practice + '%');
      if (b.exam != null) parts.push('imtahan ' + b.exam + '%');
      const vb = m.v.map((v, k) => {
        const e = (store.best[m.id + '-v' + (k + 1)] || {}).exam;
        return '<button type="button" data-act="variant" data-id="' + m.id + '" data-v="' + k + '" aria-pressed="' + (sel === k) + '" title="' + v.length + ' sual' + (e != null ? ', ən yaxşı imtahan nəticəsi ' + e + '%' : '') + '">' + (k + 1) + (e != null && e >= TARGET ? ' ✓' : '') + '</button>';
      }).join('') + '<button type="button" data-act="variant" data-id="' + m.id + '" data-v="r" aria-pressed="' + (sel === 'r') + '">Təsadüfi</button>';
      const scope = sel === 'r' ? 'təsadüfi test' : 'variant ' + (sel + 1) + ', ' + m.v[sel].length + ' sual';
      return '<li class="mod" data-id="' + m.id + '"><span class="code">' + esc(m.code) + '</span>' +
        '<div><div class="name">' + esc(m.title) + '</div><div class="meta"><span>' + m.qs.length + ' sual, ' + m.v.length + ' test variantı</span>' +
        (parts.length ? '<span class="best">Ən yaxşı nəticə (' + scope + '): ' + parts.join(', ') + '</span>' : '') + '</div>' +
        '<div class="vrow"><span class="vlabel">Test variantı</span><div class="seg sm" role="group" aria-label="' + esc(m.code) + ' test variantı">' + vb + '</div></div></div>' +
        '<div class="acts"><button class="btn" data-act="start" data-mode="practice" data-id="' + m.id + '">Məşq et</button>' +
        '<button class="btn primary" data-act="start" data-mode="exam" data-id="' + m.id + '">İmtahan ver</button></div></li>';
    };
    const mixBest = (k) => { const b = store.best['mix-' + k]; return b && b.exam != null ? ' (ən yaxşı: ' + b.exam + '%)' : ''; };
    app.innerHTML =
      '<header class="masthead"><div class="wrap"><h1>Risklərin idarə edilməsi üzrə imtahan simulyatoru</h1>' +
      '<p>Mərkəzi Bankın peşəkar sertifikatlaşma imtahanına hazırlıq: ' + MODS.length + ' modul, ' + TOTAL + ' sual, ' + VARS + ' test variantı. Məşq rejimində hər cavabdan sonra izah görünür. İmtahan rejimində vaxt məhduddur və nəticə sonda açıqlanır.</p></div></header>' +
      '<div class="guilloche" aria-hidden="true"></div>' +
      '<main class="wrap">' +
      '<section class="panel" aria-label="Testin parametrləri"><div class="row">' +
      '<div class="field"><span class="label" id="lc">Sual sayı (təsadüfi və qarışıq test)</span><div class="seg" role="group" aria-labelledby="lc">' + seg('count', [['10', '10'], ['20', '20'], ['40', '40'], ['all', 'Hamısı']], settings.count) + '</div></div>' +
      '<div class="field"><span class="label" id="lo">Sualların sırası</span><div class="seg" role="group" aria-labelledby="lo">' + seg('order', [['random', 'Qarışıq'], ['seq', 'Ardıcıl']], settings.order) + '</div></div>' +
      '</div><p class="hint">Hər modulun sualları bir-birini təkrarlamayan sabit test variantlarına bölünüb (Word materiallarındakı variantlarla eynidir). “Təsadüfi” seçildikdə suallar modulun bütün bankından seçilir. İmtahan rejimində hər sual üçün ' + SEC + ' saniyə verilir. Təlim hədəfi: ən azı ' + TARGET + '% düzgün cavab.</p></section>' +
      '<section class="group"><h2>Qarışıq imtahan</h2><p class="note">Seçilmiş modullardan bərabər paylanmış təsadüfi suallar, vaxt məhdudiyyəti ilə.</p>' +
      '<div class="mix"><button class="btn primary" data-act="mix" data-set="req">Məcburi modullar üzrə' + mixBest('req') + '</button>' +
      '<button class="btn" data-act="mix" data-set="all">Bütün modullar üzrə' + mixBest('all') + '</button></div></section>' +
      '<section class="group"><h2>Məcburi modullar</h2><ul class="mods">' + MODS.filter((m) => m.req).map(row).join('') + '</ul></section>' +
      '<section class="group"><h2>İxtisas modulları</h2><p class="note">Yalnız əməliyyat riski və ESİ istiqamətlərində çalışanlar üçün.</p>' +
      '<ul class="mods">' + MODS.filter((m) => !m.req).map(row).join('') + '</ul></section>' +
      '<p class="foot">Suallar təlim məqsədilə hazırlanıb və rəsmi imtahan sualları deyil. Nəticələriniz yalnız bu brauzerdə saxlanılır.</p>' +
      '</main>';
  }

  function buildItems(ids) {
    const n = settings.count;
    if (ids.length === 1) {
      const m = byId[ids[0]], sel = selOf(m);
      let qis;
      if (sel === 'r') {
        qis = shuffle(m.qs.map((_, qi) => qi));
        if (n !== 'all') qis = qis.slice(0, +n);
        if (settings.order === 'seq') qis.sort((x, y) => x - y);
      } else {
        qis = m.v[sel].slice();
        if (settings.order === 'random') shuffle(qis);
      }
      return qis.map((qi) => ({ mid: m.id, qi }));
    }
    const pools = ids.map((id) => shuffle(byId[id].qs.map((_, qi) => ({ mid: id, qi }))));
    const out = [];
    const max = Math.max.apply(null, pools.map((p) => p.length));
    for (let k = 0; k < max; k++) pools.forEach((p) => { if (p[k]) out.push(p[k]); });
    return shuffle(n === 'all' ? out : out.slice(0, +n));
  }

  function start(ids, mode, label, preset) {
    if (S && S.timer) clearInterval(S.timer);
    const items = preset || buildItems(ids);
    if (!items.length) return;
    S = {
      ids, mode, label, items, i: 0, ans: new Array(items.length).fill(null), done: false, confirm: null,
      key: preset ? null : (ids.length === 1 ? keyOf(byId[ids[0]]) : 'mix-' + label), sub: ids.length === 1 ? subOf(byId[ids[0]]) : '',
      started: Date.now(), deadline: mode === 'exam' ? Date.now() + items.length * SEC * 1000 : 0, timer: 0,
    };
    if (S.deadline) S.timer = setInterval(tick, 500);
    renderQuiz(true);
  }

  function renderQuiz(top) {
    const it = S.items[S.i], m = byId[it.mid], q = qOf(it), a = S.ans[S.i];
    const practice = S.mode === 'practice', answered = a !== null, last = S.i === S.items.length - 1;
    const doneCount = S.ans.filter((x) => x !== null).length;
    const meta = [];
    if (S.ids.length > 1) meta.push(m.code);
    if (q.tag) meta.push(q.tag);
    const opts = q.o.map((o, k) => {
      let cls = 'opt';
      if (practice && answered) { if (k === q.a) cls += ' ok'; else if (k === a) cls += ' no'; } else if (a === k) cls += ' sel';
      return '<li><button type="button" class="' + cls + '" data-act="pick" data-k="' + k + '"' + (practice && answered ? ' disabled' : '') + ' aria-pressed="' + (a === k) + '"><span class="L">' + LETTERS[k] + '</span><span>' + fmt(o) + '</span></button></li>';
    }).join('');
    const fb = practice && answered
      ? '<div class="fb' + (a === q.a ? '' : ' no') + '" role="status"><strong>' + (a === q.a ? 'Düzgün cavab.' : 'Səhv cavab. Düzgün cavab: ' + LETTERS[q.a] + '.') + '</strong>' + explain(q, a, m.id) + '</div>' : '';
    let nav;
    if (practice) {
      nav = '<div class="nav"><span class="spacer"></span>' + (answered
        ? '<button class="btn primary" data-act="next">' + (last ? 'Nəticəyə bax' : 'Növbəti sual') + '</button>'
        : '<button class="btn" data-act="next">' + (last ? 'Nəticəyə bax' : 'Sualı keç') + '</button>') + '</div>';
    } else {
      nav = '<div class="nav"><button class="btn" data-act="prev"' + (S.i === 0 ? ' disabled' : '') + '>Əvvəlki</button>' +
        '<button class="btn" data-act="next"' + (last ? ' disabled' : '') + '>Növbəti</button><span class="spacer"></span>' +
        '<button class="btn primary" data-act="finish">İmtahanı bitir</button></div>' +
        '<div class="pal" aria-label="Suallar">' + S.items.map((_, i) => '<button type="button" data-act="jump" data-i="' + i + '" class="' + (S.ans[i] !== null ? 'done' : '') + (i === S.i ? ' cur' : '') + '" aria-label="Sual ' + (i + 1) + '">' + (i + 1) + '</button>').join('') + '</div>';
    }
    let confirm = '';
    if (S.confirm === 'finish') {
      const left = S.ans.filter((x) => x === null).length;
      confirm = '<div class="confirm" role="alert"><p>' + left + ' sual cavabsızdır. İmtahan bitirilsin?</p><button class="btn primary small" data-act="finish-yes">Bəli, bitir</button><button class="btn small" data-act="cancel">Davam et</button></div>';
    } else if (S.confirm === 'leave') {
      confirm = '<div class="confirm" role="alert"><p>Test dayandırılsın? Cavablarınız yadda saxlanmayacaq.</p><button class="btn primary small" data-act="leave-yes">Dayandır</button><button class="btn small" data-act="cancel">Davam et</button></div>';
    }
    app.innerHTML =
      '<div class="qbar"><div class="wrap"><button class="linkbtn" data-act="leave">Modullara qayıt</button>' +
      '<span class="title">' + esc(setTitle(S.ids, S.label) + S.sub) + (practice ? ', məşq' : ', imtahan') + '</span>' +
      '<span class="pos">' + (S.i + 1) + ' / ' + S.items.length + '</span>' +
      (S.deadline ? '<span class="timer" id="tm">' + mmss((S.deadline - Date.now()) / 1000) + '</span>' : '') +
      '</div><div class="prog"><span style="width:' + Math.round(doneCount / S.items.length * 100) + '%"></span></div></div>' +
      '<main class="wrap">' + confirm +
      '<article class="qcard">' + (meta.length ? '<p class="qmeta">' + esc(meta.join(', ')) + '</p>' : '') +
      '<h2 class="qtext">' + fmt(q.q) + '</h2>' + table(q) + '<ol class="opts">' + opts + '</ol>' + fb + '</article>' +
      nav + '<p class="keys">Klaviatura: A–D və ya 1–4 cavab seçir, Enter növbəti suala keçir.</p></main>';
    if (top) window.scrollTo(0, 0);
  }

  function pick(k) {
    if (!S || S.done) return;
    if (S.mode === 'practice') { if (S.ans[S.i] !== null) return; S.ans[S.i] = k; } else S.ans[S.i] = k;
    S.confirm = null;
    renderQuiz(false);
  }
  function go(i) { if (!S || i < 0 || i >= S.items.length) return; S.i = i; S.confirm = null; renderQuiz(true); }
  function next() {
    if (S.i < S.items.length - 1) go(S.i + 1);
    else if (S.mode === 'practice') finish(false);
  }
  function tick() {
    if (!S || S.done || !S.deadline) return;
    const left = (S.deadline - Date.now()) / 1000;
    const el = document.getElementById('tm');
    if (el) { el.textContent = mmss(left); el.classList.toggle('low', left <= 60); }
    if (left <= 0) finish(true);
  }

  function finish(timeUp) {
    if (S.timer) clearInterval(S.timer);
    S.done = true; S.timeUp = timeUp; S.spent = Math.round((Date.now() - S.started) / 1000);
    let ok = 0;
    S.items.forEach((it, i) => { if (S.ans[i] === qOf(it).a) ok++; });
    S.ok = ok; S.pct = Math.round(ok / S.items.length * 100);
    if (S.key) {
      const b = store.best[S.key] || (store.best[S.key] = {});
      b[S.mode] = Math.max(b[S.mode] == null ? 0 : b[S.mode], S.pct);
      save();
    }
    renderResults();
  }

  function renderResults() {
    const pass = S.pct >= TARGET, wrong = S.items.length - S.ok;
    const items = S.items.map((it, i) => {
      const m = byId[it.mid], q = qOf(it), a = S.ans[i], right = a === q.a;
      const opts = q.o.map((o, k) => '<p class="rv-o' + (k === q.a ? ' ok' : (k === a ? ' no' : '')) + '">' + LETTERS[k] + ') ' + fmt(o) + '</p>').join('');
      const status = right ? 'düzgün' : (a === null ? 'cavab verilməyib' : 'səhv');
      return '<li class="' + (right ? 'right' : 'wrong') + '"><p class="qmeta">' + (i + 1) + '. ' + (S.ids.length > 1 ? esc(m.code) + ', ' : '') + status + '</p>' +
        '<p class="rv-q">' + fmt(q.q) + '</p>' + table(q) + opts + '<div class="rv-x">' + explain(q, a, m.id) + '</div></li>';
    }).join('');
    app.innerHTML =
      '<div class="qbar"><div class="wrap"><button class="linkbtn" data-act="home">Modullara qayıt</button><span class="title">' + esc(setTitle(S.ids, S.label) + S.sub) + '</span></div></div>' +
      '<main class="wrap"><section class="result">' +
      '<div class="seal ' + (pass ? 'pass' : 'fail') + '" data-p="' + S.pct + '" role="img" aria-label="Nəticə ' + S.pct + ' faiz"><div class="v"><span class="pct">' + S.pct + '%</span><span class="frac">' + S.ok + ' / ' + S.items.length + ' düzgün</span></div></div>' +
      '<h2>' + (pass ? 'Təlim hədəfinə çatdınız' : 'Təlim hədəfinə hələ çatmamısınız') + '</h2>' +
      '<p class="sub">' + (S.timeUp ? 'Vaxt bitdi. ' : '') + 'Hədəf ən azı ' + TARGET + '% düzgün cavabdır' + (S.mode === 'exam' ? '. Sərf olunan vaxt: ' + mmss(S.spent) : '') + '.</p>' +
      '<div class="nav center">' + (wrong ? '<button class="btn primary" data-act="wrong">Səhvləri yenidən işlə (' + wrong + ')</button>' : '') +
      '<button class="btn" data-act="retry">Yeni test başla</button><button class="btn" data-act="home">Modullara qayıt</button></div></section>' +
      '<section><div class="rvhead"><h3>Cavabların təhlili</h3><button class="btn small" data-act="onlywrong" aria-pressed="false">Yalnız səhvləri göstər</button></div>' +
      '<ol class="review" id="rv">' + items + '</ol></section></main>';
    window.scrollTo(0, 0);
    const seal = app.querySelector('.seal');
    requestAnimationFrame(() => requestAnimationFrame(() => { seal.style.setProperty('--p', seal.dataset.p); }));
  }

  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'count' || act === 'order') { settings[act] = b.dataset.v; save(); home(); }
    else if (act === 'variant') {
      settings.variant[b.dataset.id] = b.dataset.v === 'r' ? 'r' : +b.dataset.v;
      save(); home();
      const again = app.querySelector('[data-act="variant"][data-id="' + b.dataset.id + '"][data-v="' + b.dataset.v + '"]');
      if (again) again.focus();
    }
    else if (act === 'start') start([b.dataset.id], b.dataset.mode, b.dataset.id);
    else if (act === 'mix') start(b.dataset.set === 'req' ? REQ : ALL, 'exam', b.dataset.set);
    else if (act === 'pick') pick(+b.dataset.k);
    else if (act === 'next') next();
    else if (act === 'prev') go(S.i - 1);
    else if (act === 'jump') go(+b.dataset.i);
    else if (act === 'finish') { if (S.ans.some((x) => x === null)) { S.confirm = 'finish'; renderQuiz(true); } else finish(false); }
    else if (act === 'finish-yes') finish(false);
    else if (act === 'leave') { if (S && !S.done && S.ans.some((x) => x !== null)) { S.confirm = 'leave'; renderQuiz(true); } else home(); }
    else if (act === 'leave-yes' || act === 'home') home();
    else if (act === 'cancel') { S.confirm = null; renderQuiz(false); }
    else if (act === 'retry') start(S.ids, S.mode, S.label);
    else if (act === 'wrong') { const w = S.items.filter((it, i) => S.ans[i] !== qOf(it).a); start(S.ids, 'practice', S.label, w); }
    else if (act === 'onlywrong') {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      document.getElementById('rv').classList.toggle('onlywrong', on);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (!S || S.done || e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key.toLowerCase();
    let idx = '1234'.indexOf(k);
    if (idx < 0) idx = 'abcd'.indexOf(k);
    const q = qOf(S.items[S.i]);
    if (idx >= 0 && idx < q.o.length) { e.preventDefault(); pick(idx); return; }
    if (e.key === 'Enter' && !(e.target && e.target.tagName === 'BUTTON')) {
      if (S.mode === 'exam' || S.ans[S.i] !== null) { e.preventDefault(); next(); }
    } else if (S.mode === 'exam' && e.key === 'ArrowRight') go(S.i + 1);
    else if (S.mode === 'exam' && e.key === 'ArrowLeft') go(S.i - 1);
  });

  function focusHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (S || !byId[id]) return;
    const row = app.querySelector('.mod[data-id="' + id + '"]');
    if (row) { row.classList.add('flash'); row.scrollIntoView({ block: 'center' }); }
  }
  window.addEventListener('hashchange', () => { if (!S) { home(); focusHash(); } });
  home();
  focusHash();
})();
</script>
</body>
</html>
